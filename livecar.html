<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookGadi - Live Tracking & Fare</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f0f2f5; }
        #map { height: 500px; width: 100%; border-bottom: 5px solid #1a73e8; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: -50px; position: relative; z-index: 10; }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        .status-info { font-size: 14px; text-align: center; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="container">
        <div class="card">
            <h2>BookGadi Live Tracking</h2>
            <p class="status-info" id="carStatus">Checking for live cars...</p>
            
            <div id="fare-calculator">
                </div>
        </div>
    </div>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com",
            projectId: "bookgadi-97c98"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map;
        let markers = {}; // सभी ऑनलाइन कारों के लिए

        // 2. Initialize Google Map
        function initMap() {
            // Lucknow और Azamgarh के बीच का सेंटर
            const centerPoint = { lat: 26.5000, lng: 82.1000 };
            
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8,
                center: centerPoint,
                mapTypeControl: false,
                streetViewControl: false
            });

            // मैप लोड होते ही कारों को ट्रैक करना शुरू करें
            trackAllCars();
        }

        // 3. Live Tracking Logic
        function trackAllCars() {
            const carsRef = db.ref('live_cars');

            carsRef.on('value', (snapshot) => {
                const allCars = snapshot.val();
                
                // अगर कोई भी कार ऑनलाइन नहीं है
                if (!allCars) {
                    document.getElementById('carStatus').innerText = "Abhi koi car online nahi hai.";
                    // पुराने सभी मार्कर हटा दें
                    for (let id in markers) {
                        markers[id].setMap(null);
                    }
                    markers = {};
                    return;
                }

                document.getElementById('carStatus').innerText = "Live cars on road: " + Object.keys(allCars).length;

                // ऑफलाइन हुई कारों को मैप से हटाना
                for (let id in markers) {
                    if (!allCars[id]) {
                        markers[id].setMap(null);
                        delete markers[id];
                    }
                }

                // ऑनलाइन कारों को दिखाना या अपडेट करना
                Object.keys(allCars).forEach(id => {
                    const data = allCars[id];
                    const pos = { lat: data.lat, lng: data.lng };

                    if (!markers[id]) {
                        // नई कार का मार्कर बनाएँ
                        markers[id] = new google.maps.Marker({
                            position: pos,
                            map: map,
                            title: data.driverName || "BookGadi Car",
                            icon: {
                                url: "https://cdn-icons-png.flaticon.com/512/3082/3082383.png", // Real Car Icon
                                scaledSize: new google.maps.Size(40, 40),
                                anchor: new google.maps.Point(20, 20)
                            }
                        });
                    } else {
                        // कार की लोकेशन अपडेट करें
                        markers[id].setPosition(pos);
                    }
                });
            });
        }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_ACTUAL_GOOGLE_MAPS_KEY&callback=initMap" async defer></script>

</body>
</html>
