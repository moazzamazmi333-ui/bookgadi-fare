<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookGadi - Live Tracking & Fare Calculator</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
:root { --primary: #1a73e8; --success: #25D366; --dark: #202124; --warning: #f4b400; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

body { 
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0;
}

.card {
    width: 100%; max-width: 500px; background: #fff; border-radius: 0 0 24px 24px;
    overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.4); margin-top: 0;
}

/* मैप डिजाइन - No Gaps */
.map-wrapper { position: relative; width: 100%; height: 400px; border-bottom: 0px solid var(--primary); }
#map { height: 100%; width: 100%; }

/* लाइव काउंटर - Top Left */
.live-indicator {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: white; padding: 5px 12px; border-radius: 20px;
    display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    border: 1px solid var(--primary);
}
.dot { height: 8px; width: 8px; background: #28a745; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% {transform: scale(0.9);} 70% {transform: scale(1.2);} 100% {transform: scale(0.9);} }

/* मैप कंट्रोल्स - Top Right */
.map-controls { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
.ctrl-btn {
    background: white; border: 1px solid #ccc; width: 35px; height: 35px;
    border-radius: 4px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.content { padding: 20px; }
.input-box { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; border: 1.5px solid #eee; margin-bottom: 10px; outline: none; }
.btn-loc { background: #f1f3f4; color: var(--primary); border: none; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; width: 100%; margin-bottom: 15px; }
select { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #eee; margin-bottom: 15px; font-weight: 600; }
.trip-type { display: flex; gap: 10px; margin-bottom: 15px; }
.trip-type label { flex: 1; padding: 10px; background: #f8f9fa; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #eee; }
.trip-type input { display: none; }
.trip-type label:has(input:checked) { background: var(--primary); color: #fff; border-color: var(--primary); }

.main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn-calc { background: var(--dark); color: #fff; }
.btn-wa { background: var(--success); color: #fff; margin-top: 10px; }

.fare-card { padding: 15px; background: #f0f7ff; border-radius: 12px; border-left: 5px solid var(--primary); margin-top: 15px; }
.info-note { font-size: 11px; color: #666; margin-top: 8px; background: #fff9e6; padding: 8px; border-radius: 8px; border: 1px dashed var(--warning); }
#userForm { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
</style>
</head>
<body>

<div class="card">
    <div class="map-wrapper" id="fullContainer">
        <div class="live-indicator">
            <span class="dot"></span>
            <span id="carStatus" style="font-size:12px; font-weight:bold;">Live: 0</span>
        </div>
        <div class="map-controls">
            <button class="ctrl-btn" onclick="toggleFS()">⛶</button>
            <button class="ctrl-btn" onclick="fitRoute()">📍</button>
        </div>
        <div id="map"></div>
    </div>

    <div class="content">
        <input id="pickup" class="input-box" placeholder="Kahan se? (Pickup Location)">
        <button class="btn-loc" id="locBtn" onclick="useMyLocation()">📍 Current Location Use Karein</button>
        <input id="drop" class="input-box" placeholder="Kahan tak? (Drop Location)">
        
        <select id="vehicle">
            <option value="12">🚙 SUV (₹12/km)</option>
            <option value="10">🚕 Sedan (₹10/km)</option>
        </select>

        <div id="tripOptions" class="trip-type">
            <label><input type="radio" name="trip" id="oneway" checked onchange="calculateFare()"> One Way</label>
            <label><input type="radio" name="trip" id="roundtrip" onchange="calculateFare()"> Round Trip</label>
        </div>

        <button class="main-btn btn-calc" onclick="calculateFare()">Kiraaya Dekhein</button>
        
        <div id="result"></div>
        <button id="waBtn" class="main-btn btn-wa" onclick="openBooking()" style="display:none">💬 Booking WhatsApp Karein</button>

        <div id="userForm">
            <input id="custName" class="input-box" placeholder="Aapka Naam">
            <input id="custPhone" class="input-box" type="tel" placeholder="Mobile Number">
            <div style="display: flex; gap: 10px;">
                <input id="rideDate" class="input-box" type="date" style="flex: 1;">
                <input id="rideTime" class="input-box" type="time" style="flex: 1;">
            </div>
            <button class="main-btn btn-wa" onclick="sendWhatsApp()">Confirm & WhatsApp Book Karein</button>
        </div>
    </div>
</div>

<script>
// Firebase Setup
const firebaseConfig = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com", projectId: "bookgadi-97c98" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, geocoder, pickupAC, dropAC, directionsRenderer, directionsService;
let markers = {};
const LKO = { lat: 26.8467, lng: 80.9462 };
const AZM = { lat: 26.0739, lng: 83.1859 };

function initMap() {
    document.getElementById('rideDate').valueAsDate = new Date();
    geocoder = new google.maps.Geocoder();
    directionsService = new google.maps.DirectionsService();
    
    // रूट लाइन को थोड़ा और मोटा (6) किया गया है ताकि सफेद मैप पर चमके
    directionsRenderer = new google.maps.DirectionsRenderer({ 
        polylineOptions: { 
            strokeColor: "#1a73e8", 
            strokeWeight: 6,
            strokeOpacity: 0.8
        } 
    });
    
    map = new google.maps.Map(document.getElementById("map"), {
        center: {lat: 26.5, lng: 82.1},
        zoom: 8,
        zoomControl: true,
        streetViewControl: false,
        mapTypeControl: false,
        fullscreenControl: true, // फुल स्क्रीन बटन चालू किया गया
        
        // एडवांस्ड सिल्वर/व्हाइट थीम स्टाइल्स
        styles: [
            {
                "featureType": "all",
                "stylers": [{ "color": "#f5f5f5" }] // बेस कलर हल्का ग्रे
            },
            {
                "featureType": "poi",
                "stylers": [{ "visibility": "off" }] // मंदिर/दुकान गायब
            },
            {
                "featureType": "road",
                "elementType": "geometry",
                "stylers": [{ "color": "#ffffff" }] // सड़कें एकदम सफ़ेद
            },
            {
                "featureType": "road.highway",
                "elementType": "geometry",
                "stylers": [{ "color": "#ffffff" }] // हाईवे भी सफ़ेद
            },
            {
                "featureType": "road.highway",
                "elementType": "labels.text.fill",
                "stylers": [{ "color": "#616161" }] // हाईवे के नाम हल्का ग्रे
            },
            {
                "featureType": "water",
                "stylers": [{ "color": "#e0e0e0" }] // पानी हल्का सिल्वर
            },
            {
                "featureType": "administrative.locality",
                "elementType": "labels.text.fill",
                "stylers": [{ "color": "#757575" }] // शहरों के नाम (Lucknow/Azamgarh) हल्का डार्क ग्रे
            }
        ]
    });

    directionsRenderer.setMap(map);

    pickupAC = new google.maps.places.Autocomplete(document.getElementById("pickup"), {
        componentRestrictions: { country: "in" }
    });
    dropAC = new google.maps.places.Autocomplete(document.getElementById("drop"), {
        componentRestrictions: { country: "in" }
    });
    
    fitRoute();
    trackCars();
}
    
function fitRoute() {
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(LKO); bounds.extend(AZM);
    map.fitBounds(bounds);
}

function toggleFS() {
    const el = document.getElementById("fullContainer");
    if (!document.fullscreenElement) el.requestFullscreen();
    else document.exitFullscreen();
}

// Live Tracking Logic
function trackCars() {
    db.ref('live_cars').on('value', (snap) => {
        const cars = snap.val();
        if(!cars) { 
            document.getElementById('carStatus').innerText = "Live: 0";
            for(let id in markers) markers[id].setMap(null);
            markers = {}; return; 
        }
        document.getElementById('carStatus').innerText = "Live: " + Object.keys(cars).length;
        
        Object.keys(cars).forEach(id => {
            const pos = { lat: cars[id].lat, lng: cars[id].lng };
            if(!markers[id]) {
                markers[id] = new google.maps.Marker({
                    position: pos, map: map,
                    icon: { url: "https://static.wixstatic.com/media/843689_497878e241e348adbd167a8cc7462f1b~mv2.png", scaledSize: new google.maps.Size(30,30) }
                });
            } else { markers[id].setPosition(pos); }
        });
    });
}

// Fare Logic
function useMyLocation(){
    const btn = document.getElementById("locBtn");
    btn.innerText = "⌛ Dhoondh rahe hain...";
    navigator.geolocation.getCurrentPosition((pos) => {
        const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        geocoder.geocode({ location: latlng }, (results, status) => {
            if (status === "OK" && results[0]) {
                document.getElementById("pickup").value = results[0].formatted_address;
                map.setCenter(latlng); map.setZoom(15);
                btn.innerText = "✅ Location Set";
            }
        });
    });
}

function calculateFare(){
    const p = document.getElementById("pickup").value;
    const d = document.getElementById("drop").value;
    if(!p || !d) return alert("Location bharein");

    directionsService.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, status) => {
        if (status === 'OK') {
            directionsRenderer.setDirections(res);
            const km = res.routes[0].legs[0].distance.value / 1000;
            const rate = Number(document.getElementById("vehicle").value);
            const isRound = document.getElementById("roundtrip").checked;
            let fare = isRound ? Math.round(km * rate * 2 + 300) : Math.round(250 + km * rate);
            
            document.getElementById("result").innerHTML = `
                <div class="fare-card">
                    <b>Distance:</b> ${km.toFixed(1)} km | <b>Fare:</b> <span id="finalFare" style="color:var(--primary); font-size:20px;">₹${fare}</span>
                    <div class="info-note">⚠️ Toll, State Tax & Parking extra.</div>
                </div>`;
            document.getElementById("waBtn").style.display = "block";
        }
    });
}

function openBooking(){ document.getElementById("userForm").style.display = "block"; document.getElementById("waBtn").style.display = "none"; }

function sendWhatsApp(){
  const name      = document.getElementById("custName").value.trim();
  const phone     = document.getElementById("custPhone").value.trim();
  const date      = document.getElementById("rideDate").value;
  const time      = document.getElementById("rideTime").value;
  const vehicle   = document.getElementById("vehicle").options[document.getElementById("vehicle").selectedIndex].text;
  const tripType  = document.getElementById("roundtrip").checked ? "Round Trip" : "One Way";
  const pickupVal = document.getElementById("pickup").value.trim();
  const dropVal   = document.getElementById("drop").value.trim();
  const fareElement = document.getElementById("finalFare");

  if(!name || !phone || phone.length < 10 || !date || !time || !pickupVal || !dropVal || !fareElement) {
    alert("कृपया सभी जानकारी सही से भरें");
    return;
  }

  const fareVal = fareElement.innerText;

  // Google Maps Navigation Link बनाना (यही वो हिस्सा है जो ठीक किया गया है)
  const encodedPickup = encodeURIComponent(pickupVal);
  const encodedDrop = encodeURIComponent(dropVal);
  const routeLink = `https://www.google.com/maps/dir/?api=1&origin=${encodedPickup}&destination=${encodedDrop}&travelmode=driving`;

  // WhatsApp मेसेज का फॉर्मेट
  const msg = `*BookGadi New Booking*\n\n` +
              `🚗 *Vehicle:* ${vehicle}\n` +
              `↕️ *Trip:* ${tripType}\n` +
              `👤 *Customer:* ${name}\n` +
              `📞 *Phone:* ${phone}\n` +
              `📅 *Date/Time:* ${date} | ${time}\n` +
              `💰 *Estimated Fare:* ${fareVal}\n\n` +
              `📍 *Pickup:* ${pickupVal}\n` +
              `🏁 *Drop:* ${dropVal}\n\n` +
              `🗺️ *Navigate Route:* ${routeLink}`;

  const encodedMsg = encodeURIComponent(msg);
  window.open(`https://wa.me/919651191446?text=${encodedMsg}`, "_blank");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
