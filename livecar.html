<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="title" content="BookGadi - Live Taxi Tracking & Online Cab Booking">
<meta name="description" content="BookGadi के साथ सुरक्षित और सस्ती टैक्सी बुक करें। लाइव कार ट्रैकिंग, पारदर्शी किराया (₹10/km) और 24/7 सर्विस। लखनऊ, आज़मगढ़ और उत्तर प्रदेश में उपलब्ध।">
<meta name="theme-color" content="#1a73e8">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
:root { --primary: #1a73e8; --success: #25D366; --dark: #202124; --warning: #f4b400; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

body { background: #f8f9fa; min-height: 100vh; padding-bottom: 80px; /* Space for Bottom Menu */ }

.card { width: 100%; max-width: 500px; background: #fff; margin: 0 auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

.map-wrapper { position: relative; width: 100%; height: 400px; }
#map { height: 100%; width: 100%; }

.live-indicator {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: white; padding: 6px 14px; border-radius: 20px;
    display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 1px solid #eee;
}
.dot { height: 8px; width: 8px; background: #28a745; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% {transform: scale(0.9);} 70% {transform: scale(1.2);} 100% {transform: scale(0.9);} }

.content { padding: 25px 20px; background: #ffffff; border-radius: 25px 25px 0 0; margin-top: -25px; position: relative; z-index: 5; }

.input-box { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; border: 1.5px solid #eee; margin-bottom: 12px; outline: none; background: #fafafa; }
.btn-loc { background: #f1f3f4; color: var(--primary); border: none; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 20px; }
.trip-type { display: flex; gap: 10px; margin-bottom: 20px; }
.trip-type label { flex: 1; padding: 12px; background: #f8f9fa; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #eee; }
.trip-type input { display: none; }
.trip-type label:has(input:checked) { background: var(--primary); color: #fff; border-color: var(--primary); }

.main-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn-calc { background: var(--dark); color: #fff; }
.btn-wa { background: var(--success); color: #fff; margin-top: 12px; }

.fare-card { padding: 18px; background: #f0f7ff; border-radius: 15px; border-left: 6px solid var(--primary); margin-top: 20px; }

/* BOTTOM MENU STYLE */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; background: white; 
    height: 70px; display: flex; justify-content: space-around; align-items: center; 
    box-shadow: 0 -2px 15px rgba(0,0,0,0.1); z-index: 1000; border-top: 1px solid #eee;
}
.nav-item { text-align: center; color: #5f6368; cursor: pointer; flex: 1; transition: 0.3s; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; margin-bottom: 2px; }
.nav-text { font-size: 11px; font-weight: 600; }

#userForm { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
</style>
</head>
<body>

<div class="card">
    <div class="map-wrapper" id="fullContainer">
        <div class="live-indicator">
            <span class="dot"></span>
            <span id="carStatus" style="font-size:13px; font-weight:bold;">Live: 0</span>
        </div>
        <div id="map"></div>
    </div>

    <div class="content">
        <input id="pickup" class="input-box" placeholder="Kahan se? (Pickup Location)">
        <button class="btn-loc" onclick="useMyLocation()">📍 Current Location Use Karein</button>
        <input id="drop" class="input-box" placeholder="Kahan tak? (Drop Location)">
        
        <select id="vehicle" class="input-box" style="font-weight: bold;">
            <option value="12">🚙 SUV (₹12/km)</option>
            <option value="10" selected>🚕 Sedan (₹10/km)</option>
        </select>

        <div class="trip-type">
            <label><input type="radio" name="trip" id="oneway" checked onchange="calculateFare()"> One Way</label>
            <label><input type="radio" name="trip" id="roundtrip" onchange="calculateFare()"> Round Trip</label>
        </div>

        <button class="main-btn btn-calc" onclick="calculateFare()">Kiraaya Dekhein</button>
        
        <div id="result"></div>
        <button id="waBtn" class="main-btn btn-wa" onclick="openBooking()" style="display:none">💬 Booking WhatsApp Karein</button>

        <div id="userForm">
            <input id="custName" class="input-box" placeholder="Aapka Naam">
            <input id="custPhone" class="input-box" type="tel" placeholder="Mobile Number">
            <div style="display: flex; gap: 10px;">
                <input id="rideDate" class="input-box" type="date" style="flex: 1;">
                <input id="rideTime" class="input-box" type="time" style="flex: 1;">
            </div>
            <button class="main-btn btn-wa" onclick="sendWhatsApp()">Confirm & Book Now</button>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()">
        <div class="nav-icon">🏠</div>
        <div class="nav-text">Home</div>
    </div>
    <div class="nav-item" onclick="window.location.href='https://www.bookgadi.com/contact'">
        <div class="nav-icon">📅</div>
        <div class="nav-text">My Bookings</div>
    </div>
    <div class="nav-item" onclick="window.location.href='tel:9651191446'">
        <div class="nav-icon">📞</div>
        <div class="nav-text">Call Us</div>
    </div>
    <div class="nav-item" onclick="window.location.href='https://www.bookgadi.com/about'">
        <div class="nav-icon">👤</div>
        <div class="nav-text">About</div>
    </div>
</div>

<script>
// ... (आपका पुराना JavaScript यहाँ रहेगा - Firebase, Map, Calculation functions)
const firebaseConfig = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com", projectId: "bookgadi-97c98" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, geocoder, pickupAC, dropAC, directionsRenderer, directionsService, infoWindow;
let markers = {};

function initMap(){
    document.getElementById('rideDate').valueAsDate = new Date();
    geocoder = new google.maps.Geocoder();
    directionsService = new google.maps.DirectionsService();
    infoWindow = new google.maps.InfoWindow();
    directionsRenderer = new google.maps.DirectionsRenderer({ polylineOptions: { strokeColor: "#1a73e8", strokeWeight: 6 } });
    
    map = new google.maps.Map(document.getElementById("map"),{
        center: {lat: 26.5, lng: 82.1},
        zoom: 9,
        disableDefaultUI: true,
        zoomControl: false
    });
    directionsRenderer.setMap(map);

    pickupAC = new google.maps.places.Autocomplete(document.getElementById("pickup"));
    dropAC = new google.maps.places.Autocomplete(document.getElementById("drop"));
    
    trackCars();
}

function trackCars() {
    db.ref('live_cars').on('value', (snap) => {
        const cars = snap.val();
        let onlineCount = 0;
        if(cars) {
            Object.keys(cars).forEach(id => {
                const data = cars[id];
                if (data.status === "online" && data.lat) {
                    onlineCount++;
                    const pos = { lat: parseFloat(data.lat), lng: parseFloat(data.lng) };
                    if(!markers[id]) {
                        markers[id] = new google.maps.Marker({
                            position: pos, map: map,
                            icon: { url: "https://static.wixstatic.com/media/843689_497878e241e348adbd167a8cc7462f1b~mv2.png", scaledSize: new google.maps.Size(32,32) }
                        });
                    } else { markers[id].setPosition(pos); }
                }
            });
        }
        document.getElementById('carStatus').innerText = "Live: " + onlineCount;
    });
}

function useMyLocation(){
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            geocoder.geocode({ location: latlng }, (results, status) => {
                if (status === "OK") {
                    document.getElementById("pickup").value = results[0].formatted_address;
                    map.setCenter(latlng); map.setZoom(14);
                }
            });
        });
    }
}

function calculateFare(){
    const p = document.getElementById("pickup").value;
    const d = document.getElementById("drop").value;
    if(!p || !d) return alert("Kahan se kahan tak jana hai?");

    directionsService.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, status) => {
        if (status === 'OK') {
            directionsRenderer.setDirections(res);
            const km = res.routes[0].legs[0].distance.value / 1000;
            const rate = Number(document.getElementById("vehicle").value);
            const isRound = document.getElementById("roundtrip").checked;
            let fare = isRound ? Math.round(km * rate * 2 + 300) : Math.round(250 + km * rate);
            
            document.getElementById("result").innerHTML = `
                <div class="fare-card">
                    <b>Duri:</b> ${km.toFixed(1)} km<br>
                    <b>Anumanit Kiraya:</b> <span id="finalFare" style="color:var(--primary); font-size:22px;">₹${fare}</span>
                    <div style="font-size:10px; color:red; margin-top:5px;">*Toll aur State Tax alag se dena hoga.</div>
                </div>`;
            document.getElementById("waBtn").style.display = "block";
        }
    });
}

function openBooking(){ document.getElementById("userForm").style.display = "block"; document.getElementById("waBtn").style.display = "none"; }

function sendWhatsApp(){
    const n = document.getElementById("custName").value;
    const ph = document.getElementById("custPhone").value;
    const f = document.getElementById("finalFare").innerText;
    if(!n || ph.length < 10) return alert("Sahi details bharein");

    const msg = `*BookGadi Booking Request*\n\nName: ${n}\nPhone: ${ph}\nFare: ${f}\nPickup: ${document.getElementById("pickup").value}\nDrop: ${document.getElementById("drop").value}`;
    
    // Firebase entry
    db.ref('bookings').push({ name: n, phone: ph, fare: f, date: document.getElementById("rideDate").value, pickup: document.getElementById("pickup").value });

    window.open(`https://wa.me/919651191446?text=${encodeURIComponent(msg)}`, "_blank");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
