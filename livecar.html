<meta property="og:type" content="website">

<meta property="og:title" content="BookGadi - सस्ती और सुरक्षित टैक्सी बुकिंग">
<meta property="og:description" content="लाइव ट्रैकिंग के साथ अपनी टैक्सी बुक करें। किराया सिर्फ ₹10/km से शुरू।">

<style>
:root { --primary: #1a73e8; --success: #25D366; --dark: #202124; --warning: #f4b400; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

body { 
    background: #f8f9fa; 
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0;
}

.card {
    width: 100%; max-width: 500px; background: #fff; border-radius: 0 0 24px 24px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 0;
}

.map-wrapper { 
    position: relative; 
    width: 100%; 
    height: 450px; 
    border: none; 
    margin: 0;
    padding: 0;
}
#map { height: 100%; width: 100%; }

.live-indicator {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: white; padding: 6px 14px; border-radius: 20px;
    display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    border: 1px solid #eee;
}
.dot { height: 8px; width: 8px; background: #28a745; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% {transform: scale(0.9);} 70% {transform: scale(1.2);} 100% {transform: scale(0.9);} }

.map-controls { position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
.ctrl-btn {
    background: white; border: 1px solid #eee; width: 38px; height: 38px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.content { 
    padding: 25px 20px; 
    background: #ffffff;
    border-radius: 25px 25px 0 0;
    margin-top: -25px; 
    position: relative;
    z-index: 5;
}

.input-box { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; border: 1.5px solid #eee; margin-bottom: 12px; outline: none; background: #fafafa; }
.btn-loc { background: #f1f3f4; color: var(--primary); border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 20px; }
select { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid #eee; margin-bottom: 15px; font-weight: 600; background: #fff; }
.trip-type { display: flex; gap: 10px; margin-bottom: 20px; }
.trip-type label { flex: 1; padding: 12px; background: #f8f9fa; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #eee; transition: 0.3s; }
.trip-type input { display: none; }
.trip-type label:has(input:checked) { background: var(--primary); color: #fff; border-color: var(--primary); }

.main-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
.btn-calc { background: var(--dark); color: #fff; }
.btn-wa { background: var(--success); color: #fff; margin-top: 12px; }

.fare-card { padding: 18px; background: #f0f7ff; border-radius: 15px; border-left: 6px solid var(--primary); margin-top: 20px; }
.info-note { font-size: 11px; color: #666; margin-top: 10px; background: #fff9e6; padding: 10px; border-radius: 10px; border: 1px dashed var(--warning); }
#userForm { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }

/* Driver Section Styles */
.driver-entry { text-align: center; margin-top: 20px; font-size: 13px; }
.driver-entry a { color: var(--primary); text-decoration: none; font-weight: bold; }
#driverPanel { display: none; margin-top: 20px; padding: 15px; border: 2px solid var(--primary); border-radius: 15px; background: #f0f4ff; }

/* Booking List Styles */
.booking-list { margin-top: 20px; max-height: 300px; overflow-y: auto; }
.job-card { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.job-card b { color: var(--primary); }
.job-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
    <div class="map-wrapper" id="fullContainer">
        <div class="live-indicator">
            <span class="dot"></span>
            <span id="carStatus" style="font-size:13px; font-weight:bold; color:#333;">Live: 0</span>
        </div>
        <div class="map-controls">
            <button class="ctrl-btn" onclick="toggleFS()">⛶</button>
            <button class="ctrl-btn" onclick="fitRoute()">📍</button>
        </div>
        <div id="map"></div>
    </div>

    <div class="content">
        <div id="customerSection">
            <input id="pickup" class="input-box" placeholder="Kahan se? (Pickup Location)">
            <button class="btn-loc" id="locBtn" onclick="useMyLocation()">📍 Current Location Use Karein</button>
            <input id="drop" class="input-box" placeholder="Kahan tak? (Drop Location)">
            
            <select id="vehicle">
                <option value="12">🚙 SUV (₹12/km)</option>
                <option value="10">🚕 Sedan (₹10/km)</option>
            </select>

            <div id="tripOptions" class="trip-type">
                <label><input type="radio" name="trip" id="oneway" checked onchange="calculateFare()"> One Way</label>
                <label><input type="radio" name="trip" id="roundtrip" onchange="calculateFare()"> Round Trip</label>
            </div>

            <button class="main-btn btn-calc" onclick="calculateFare()">Kiraaya Dekhein</button>
            
            <div id="result"></div>
            <button id="waBtn" class="main-btn btn-wa" onclick="openBooking()" style="display:none">💬 Booking WhatsApp Karein</button>

            <div id="userForm">
                <input id="custName" class="input-box" placeholder="Aapka Naam">
                <input id="custPhone" class="input-box" type="tel" placeholder="Mobile Number (10 digit)">
                <div style="display: flex; gap: 10px;">
                    <input id="rideDate" class="input-box" type="date" style="flex: 1;">
                    <input id="rideTime" class="input-box" type="time" style="flex: 1;">
                </div>
                <button class="main-btn btn-wa" onclick="sendWhatsApp()">Confirm & WhatsApp Book Karein</button>
            </div>

            <div class="driver-entry">
                ड्राइवर हैं? <a href="#" onclick="showDriverPanel()">यहाँ से ऑनलाइन आएं</a>
            </div>
        </div>

        <div id="driverPanel">
            <h4 style="margin-bottom:10px; color:var(--primary);">Driver Partner Panel</h4>
            <input id="driverName" class="input-box" placeholder="आपका नाम">
            <input id="driverID" class="input-box" placeholder="गाड़ी नंबर या ID">
            <button id="onlineBtn" class="main-btn btn-wa" onclick="toggleDriverOnline()">Go Online (Start Live)</button>
            
            <div id="pipContainer" style="display:none; margin-top:10px;">
                <canvas id="pipCanvas" width="300" height="150" style="display:none;"></canvas>
                <button class="btn-loc" onclick="startPiP()" style="background:#34a853; color:white; margin-bottom:10px;">
                    📱 Floating Mode (Home Screen)
                </button>
            </div>

            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">
            <h5 style="margin-bottom:10px;">New Bookings (Today)</h5>
            <div id="bookingList" class="booking-list">
                <p style="font-size:12px; color:#666; text-align:center;">लोड हो रहा है...</p>
            </div>

            <button class="btn-loc" style="margin-top:10px;" onclick="location.reload()">Back to Booking</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com", projectId: "bookgadi-97c98" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, geocoder, pickupAC, dropAC, directionsRenderer, directionsService, infoWindow;
let markers = {};
const LKO = { lat: 26.8467, lng: 80.9462 };
const AZM = { lat: 26.0739, lng: 83.1859 };

// Driver tracking variables
let isOnline = false;
let watchID = null;
let pipVideo = null;

function initMap(){
    document.getElementById('rideDate').valueAsDate = new Date();
    geocoder = new google.maps.Geocoder();
    directionsService = new google.maps.DirectionsService();
    infoWindow = new google.maps.InfoWindow();
    directionsRenderer = new google.maps.DirectionsRenderer({ 
        polylineOptions: { strokeColor: "#1a73e8", strokeWeight: 6, strokeOpacity: 0.8 } 
    });
    
    const standardStyle = [
        { "featureType": "water", "stylers": [{ "color": "#e9e9e9" }] },
        { "featureType": "landscape", "stylers": [{ "color": "#f5f5f5" }] },
        { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] },
        { "featureType": "poi", "stylers": [{ "visibility": "off" }] }
    ];

    map = new google.maps.Map(document.getElementById("map"),{
        center: {lat: 26.5, lng: 82.1},
        zoom: 9,
        styles: standardStyle,
        zoomControl: true,
        streetViewControl: false,
        mapTypeControl: false,
        fullscreenControl: false
    });
    directionsRenderer.setMap(map);

    pickupAC = new google.maps.places.Autocomplete(document.getElementById("pickup"),{componentRestrictions:{country:"in"}});
    dropAC = new google.maps.places.Autocomplete(document.getElementById("drop"),{componentRestrictions:{country:"in"}});
    
    useMyLocation(); 
    fitRoute();
    trackCars();
    
    document.getElementById('bookingList').innerHTML = "<p style='text-align:center; font-size:12px; color:orange;'>बुकिंग देखने के लिए Online आएं</p>";
}

// --- Beep Sound Logic ---
function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
    } catch(e) { console.log("Audio play error", e); }
}

// --- Floating Mode Logic ---
async function startPiP() {
    const canvas = document.getElementById('pipCanvas');
    const ctx = canvas.getContext('2d');
    const dName = document.getElementById("driverName").value || "Driver";

    function draw() {
        ctx.fillStyle = "#1a73e8"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 24px Arial";
        ctx.fillText("BookGadi LIVE", 20, 50);
        ctx.font = "20px Arial";
        ctx.fillText("Driver: " + dName, 20, 90);
        ctx.fillStyle = "#25D366";
        ctx.fillText("● Online & Active", 20, 130);
        if(isOnline) requestAnimationFrame(draw);
    }
    draw();

    const stream = canvas.captureStream();
    if (!pipVideo) {
        pipVideo = document.createElement('video');
        pipVideo.muted = true;
        pipVideo.srcObject = stream;
        pipVideo.play();
    }

    try {
        await pipVideo.requestPictureInPicture();
    } catch (error) {
        alert("Floating Mode Error: ब्राउज़र सपोर्ट नहीं करता।");
    }
}

function fitRoute() {
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(LKO); bounds.extend(AZM);
    map.fitBounds(bounds);
}

function toggleFS() {
    const el = document.getElementById("fullContainer");
    if (!document.fullscreenElement) el.requestFullscreen();
    else document.exitFullscreen();
}

function trackCars() {
    db.ref('live_cars').on('value', (snap) => {
        const cars = snap.val();
        if(!cars) { 
            document.getElementById('carStatus').innerText = "Live: 0";
            for(let id in markers) markers[id].setMap(null);
            markers = {}; 
            return; 
        }

        let onlineCount = 0;
        Object.keys(cars).forEach(id => {
            const data = cars[id];
            if (data.status === "online" && data.lat && data.lng) {
                onlineCount++;
                const pos = { lat: parseFloat(data.lat), lng: parseFloat(data.lng) };
                const driverName = data.name ? data.name : "Partner";

                if(!markers[id]) {
                    markers[id] = new google.maps.Marker({
                        position: pos, map: map,
                        label: { text: driverName, color: "black", fontSize: "11px", fontWeight: "bold" },
                        icon: { 
                            url: "https://static.wixstatic.com/media/843689_497878e241e348adbd167a8cc7462f1b~mv2.png", 
                            scaledSize: new google.maps.Size(32,32),
                            labelOrigin: new google.maps.Point(16, -10)
                        }
                    });
                } else { 
                    markers[id].setPosition(pos); 
                    if (markers[id].getMap() === null) markers[id].setMap(map);
                }
            } else if (markers[id]) {
                markers[id].setMap(null);
            }
        });
        document.getElementById('carStatus').innerText = "Live: " + onlineCount;
    });
}

function showDriverPanel() {
    document.getElementById("customerSection").style.display = "none";
    document.getElementById("driverPanel").style.display = "block";
}

function loadBookingsForDrivers() {
    if(!isOnline) return;

    db.ref('bookings').limitToLast(1).on('child_added', (snapshot) => {
        const data = snapshot.val();
        if (data && data.timestamp && (Date.now() - data.timestamp < 10000)) {
            playBeep();
        }
    });

    db.ref('bookings').limitToLast(10).on('value', (snap) => {
        const listDiv = document.getElementById('bookingList');
        const bookings = snap.val();
        if(!bookings) {
            listDiv.innerHTML = "<p style='text-align:center; font-size:12px;'>कोई बुकिंग नहीं मिली</p>";
            return;
        }

        let html = "";
        Object.keys(bookings).reverse().forEach(id => {
            const b = bookings[id];
            html += `
                <div class="job-card" style="border-left:5px solid var(--primary)">
                    <div class="job-header">
                        <span>💰 ${b.fare}</span>
                        <span style="color:#666;">🕒 ${b.time}</span>
                    </div>
                    <b>Pickup:</b> ${b.pickup}<br>
                    <b>Drop:</b> ${b.drop}<br>
                    <div style="margin-top:5px; font-size:11px; color:#1a73e8; font-weight:bold;">New Job Available</div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    });
}

function toggleDriverOnline() {
    const dName = document.getElementById("driverName").value.trim();
    const dID = document.getElementById("driverID").value.trim().replace(/[^a-zA-Z0-9]/g, "");

    if(!dName || !dID) return alert("नाम और ID भरें!");

    if(!isOnline) {
        isOnline = true;
        document.getElementById("onlineBtn").innerText = "Stop Live (Go Offline)";
        document.getElementById("onlineBtn").style.background = "#ea4335";
        document.getElementById("pipContainer").style.display = "block";
        
        loadBookingsForDrivers();

        if (navigator.geolocation) {
            watchID = navigator.geolocation.watchPosition((pos) => {
                db.ref('live_cars/' + dID).set({
                    name: dName, lat: pos.coords.latitude, lng: pos.coords.longitude,
                    status: "online", lastUpdate: Date.now()
                });
            }, (err) => console.log(err), { enableHighAccuracy: true });
            alert("आप ऑनलाइन हैं! बुकिंग आने पर आवाज़ आएगी।");
        }
    } else {
        isOnline = false;
        if(watchID) navigator.geolocation.clearWatch(watchID);
        db.ref('live_cars/' + dID).update({ status: "offline" });
        db.ref('bookings').off();
        document.getElementById("onlineBtn").innerText = "Go Online (Start Live)";
        document.getElementById("onlineBtn").style.background = "var(--success)";
        document.getElementById("pipContainer").style.display = "none";
        document.getElementById('bookingList').innerHTML = "<p style='text-align:center; font-size:12px; color:orange;'>बुकिंग देखने के लिए Online आएं</p>";
        alert("आप ऑफलाइन हो गए हैं।");
    }
}

// --- Existing Functions ---
function useMyLocation(){
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            geocoder.geocode({ location: latlng }, (results, status) => {
                if (status === "OK" && results[0]) {
                    document.getElementById("pickup").value = results[0].formatted_address;
                    map.setCenter(latlng); map.setZoom(12);
                }
            });
        });
    }
}

function calculateFare(){
    const p = document.getElementById("pickup").value;
    const d = document.getElementById("drop").value;
    if(!p || !d) return alert("Please enter locations");

    directionsService.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, status) => {
        if (status === 'OK') {
            directionsRenderer.setDirections(res);
            const leg = res.routes[0].legs[0];
            const km = leg.distance.value / 1000;
            const time = leg.duration.text;
            const rate = Number(document.getElementById("vehicle").value);
            const isRound = document.getElementById("roundtrip").checked;
            let fare = isRound ? Math.round(km * rate * 2 + 300) : Math.round(250 + km * rate);
            
            document.getElementById("result").innerHTML = `
                <div class="fare-card">
                    <b>Distance:</b> ${km.toFixed(1)} km | <b>Time:</b> ${time}<br>
                    <b>Est. Fare:</b> <span id="finalFare" style="color:var(--primary); font-size:22px;">₹${fare}</span>
                    <div class="info-note">⚠️ Toll, State Tax & Parking extra as per actual.</div>
                </div>`;
            document.getElementById("waBtn").style.display = "block";
        }
    });
}

function openBooking(){ document.getElementById("userForm").style.display = "block"; document.getElementById("waBtn").style.display = "none"; }

function sendWhatsApp(){
    const n = document.getElementById("custName").value.trim();
    const ph = document.getElementById("custPhone").value.trim();
    const p = document.getElementById("pickup").value.trim();
    const d = document.getElementById("drop").value.trim();
    const f = document.getElementById("finalFare") ? document.getElementById("finalFare").innerText : "";
    
    if(!n || ph.length < 10) return alert("Sahi details bharein");

    const now = new Date();
    const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const dateString = now.toLocaleDateString();
    
    const bookingData = { name: n, phone: ph, pickup: p, drop: d, fare: f, time: timeString, date: dateString, timestamp: Date.now() };
    db.ref('bookings').push(bookingData);

    const navLink = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(p) + "&destination=" + encodeURIComponent(d);
    const msg = `*BookGadi Booking Request*\n\n📅 *Date:* ${dateString}\n⏰ *Time:* ${timeString}\n👤 *Name:* ${n}\n📞 *Phone:* ${ph}\n💰 *Fare:* ${f}\n📍 *Pickup:* ${p}\n🏁 *Drop:* ${d}\n\n🗺️ *Route:* \n${navLink}`;
    
    window.open(`https://wa.me/919651191446?text=${encodeURIComponent(msg)}`, "_blank");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
