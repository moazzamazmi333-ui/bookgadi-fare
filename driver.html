<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f6; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 20px auto; }
        .btn-go { background: #1a73e8; width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-off { background: #dc3545; width: 100%; padding: 10px; border: none; border-radius: 8px; color: white; margin-top: 15px; }
        .status-box { background: #e8f5e9; padding: 15px; border-radius: 10px; display: none; border: 1px solid #c8e6c9; }
        .pulse { height: 10px; width: 10px; background: #2e7d32; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #bookingList { margin-top: 15px; text-align: left; max-height: 550px; overflow-y: auto; padding: 5px; }
        .booking-card { background: #fff; border: 1px solid #eee; border-left: 6px solid #1a73e8; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .fare-tag { color: #1e8e3e; font-weight: bold; font-size: 18px; float: right; }
        .time-tag { color: #d93025; font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .city-filter-active { background: #fff9c4; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #fbc02d; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.bookgadi.com/logo.png" width="120">
        
        <div id="loginSection">
            <h3>Driver Login</h3>
            <input type="text" id="driverInputID" placeholder="Enter Driver ID">
            <button class="btn-go" onclick="verifyDriver()">Login & Start</button>
        </div>

        <div id="statusSection" class="status-box">
            <div class="city-filter-active">
                <label style="font-size:12px; font-weight:bold;">Current Filter Area:</label>
                <select id="driverCity" onchange="updateFilter()">
                    <option value="ALL">Show All Bookings</option>
                    <option value="Azamgarh">Azamgarh</option>
                    <option value="Lucknow">Lucknow</option>
                    <option value="Varanasi">Varanasi</option>
                    <option value="Mau">Mau</option>
                </select>
            </div>
            
            <p style="color:#2e7d32; margin: 0; font-weight: bold;"><span class="pulse"></span> Online Duty</p>
            <h4 id="welcomeName" style="margin: 5px 0;"></h4>
            
            <div id="bookingList">Searching bookings...</div>
            <button class="btn-off" onclick="stopDuty()">Go Offline</button>
        </div>
        <div id="log" style="color:red; font-size:13px; margin-top:10px;"></div>
    </div>

    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const config = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let lastKnownId = null;
        let isFirstLoad = true;
        let globalName = "";
        let globalID = "";

        window.onload = function() {
            const savedID = localStorage.getItem('activeDriverId');
            if (savedID) {
                checkAndRestore(savedID);
            }
        };

        function verifyDriver() {
            const id = document.getElementById('driverInputID').value.trim();
            if(!id) return alert("Enter ID");
            checkAndRestore(id);
        }

        function checkAndRestore(id) {
            db.ref('live_cars/' + id).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    globalID = id;
                    globalName = snapshot.val().name;
                    localStorage.setItem('activeDriverId', id);
                    runApp();
                } else {
                    document.getElementById('log').innerText = "Driver ID not found!";
                }
            });
        }

        function updateFilter() {
            // जब ड्राइवर शहर बदलेगा तो लिस्ट तुरंत अपडेट होगी
            isFirstLoad = true; 
            runApp();
        }

        async function runApp() {
            const driverCity = document.getElementById('driverCity').value;
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('statusSection').style.display = "block";
            document.getElementById('welcomeName').innerText = globalName;

            // Permission for sound
            if ("Notification" in window) Notification.requestPermission();

            db.ref('bookings').limitToLast(300).on('value', (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('bookingList');
                list.innerHTML = ""; 

                if (!data) {
                    list.innerHTML = "<p>No bookings yet.</p>";
                    return;
                }

                const keys = Object.keys(data).reverse();
                let topId = null;
                let count = 0;

                keys.forEach(key => {
                    const b = data[key];
                    const pickup = (b.pickup || "").toLowerCase();
                    const target = driverCity.toLowerCase();
                    
                    // SMART SEARCH: Azamgarh के लिए "azam" भी चेक करेगा
                    let isMatch = (driverCity === "ALL") || pickup.includes(target);
                    
                    // Special case for Azamgarh
                    if (target === "azamgarh" && pickup.includes("azam")) isMatch = true;

                    if (isMatch) {
                        if(!topId) topId = key;
                        count++;
                        
                        const item = document.createElement('div');
                        item.className = 'booking-card';
                        item.innerHTML = `
                            <span class="fare-tag">₹${b.fare}</span>
                            <span class="time-tag">📅 ${b.date} | ⏰ ${b.time}</span>
                            <div style="font-size:14px;">📍 <b>From:</b> ${b.pickup}</div>
                            <div style="font-size:14px;">🏁 <b>To:</b> ${b.drop}</div>
                            <div style="font-size:13px; color:#1a73e8; margin-top:8px; border-top:1px solid #eee; padding-top:5px;">
                                👤 ${b.name} | 📞 <a href="tel:${b.phone}">${b.phone}</a>
                            </div>
                        `;
                        list.appendChild(item);
                    }
                });

                if (!isFirstLoad && topId && lastKnownId !== topId) {
                    document.getElementById('beepSound').play().catch(()=>{});
                }

                lastKnownId = topId;
                if(count === 0) list.innerHTML = `<p style='color:#888;'>No bookings found for "${driverCity}".</p>`;
                isFirstLoad = false;
            });

            // GPS
            navigator.geolocation.getCurrentPosition((pos) => {
                db.ref('live_cars/' + globalID).update({
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    status: "online", last_seen: Date.now()
                });
            });
        }

        function stopDuty() {
            db.ref('live_cars/' + globalID).update({ status: "offline" }).then(() => {
                localStorage.clear();
                location.reload();
            });
        }
    </script>
</body>
</html>
