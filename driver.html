<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fff; }
        .status-box { margin: 20px; padding: 15px; border-radius: 10px; font-weight: bold; }
        .btn-start { padding: 20px 40px; font-size: 20px; background: #28a745; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .online { background: #d4edda; color: #155724; }
        .offline { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <img src="https://www.bookgadi.com/logo.png" width="150" alt="BookGadi">
    <h2>Driver Control Panel</h2>
    <div id="status" class="status-box offline">Duty is Offline</div>
    <button class="btn-start" onclick="goOnline()">Go Online / Start Duty</button>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com",
            projectId: "bookgadi-97c98"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function goOnline() {
            if (navigator.geolocation) {
                document.getElementById('status').innerText = "You are LIVE now!";
                document.getElementById('status').className = "status-box online";
                
                // हाई एक्यूरेसी के साथ लोकेशन ट्रैक करना
                navigator.geolocation.watchPosition((pos) => {
                    db.ref('live_cars/car_01').set({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        heading: pos.coords.heading || 0, // गाड़ी की दिशा
                        speed: pos.coords.speed || 0,
                        updated: Date.now()
                    });
                }, (err) => {
                    alert("GPS Permission Allow Karein!");
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            }
        }
    </script>
</body>
</html>
