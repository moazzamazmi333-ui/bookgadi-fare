<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookGadi Driver Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #2e7d32; --danger: #d93025; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: auto; }
        .header { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; }
        .header img { width: 120px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 13px; font-weight: 600; color: #666; }
        input, select { width: 100%; padding: 14px; margin-top: 5px; border: 1.5px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #fff; color: var(--danger); border: 1.5px solid var(--danger); margin-top: 20px; }

        .status-card { background: white; border-radius: 20px; padding: 15px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .online-badge { display: inline-flex; align-items: center; background: #e8f5e9; color: var(--success); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .pulse { height: 8px; width: 8px; background: var(--success); border-radius: 50%; margin-right: 8px; animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #bookingList { margin-top: 20px; padding-bottom: 50px; }
        .b-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #eee; position: relative; border-left: 5px solid var(--primary); }
        .b-fare { color: var(--success); font-size: 20px; font-weight: 800; float: right; }
        .b-date { font-size: 12px; color: #777; margin-bottom: 8px; display: block; }
        .b-loc { font-size: 14px; margin: 5px 0; color: #333; }
        .b-footer { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center; }
        .call-btn { background: var(--primary); color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://www.bookgadi.com/logo.png">
        <div id="loginSection">
            <input type="text" id="driverInputID" placeholder="Enter Driver ID">
            <button class="btn btn-primary" style="margin-top:10px;" onclick="verifyDriver()">Login</button>
        </div>
    </div>

    <div id="statusSection" class="status-card">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div class="online-badge"><span class="pulse"></span> Online</div>
            <div id="welcomeName" style="font-size: 13px; font-weight: bold;"></div>
        </div>

        <div class="input-group">
            <label>Working City</label>
            <select id="areaFilter" onchange="loadBookings()">
                <option value="ALL">All Areas (All Bookings)</option>
                <option value="azam">Azamgarh</option>
                <option value="luck">Lucknow</option>
                <option value="vara">Varanasi</option>
                <option value="mau">Mau</option>
            </select>
        </div>

        <div id="bookingList">Loading...</div>
        <button class="btn btn-danger" onclick="stopDuty()">Logout / Offline</button>
    </div>
</div>

<audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
    const config = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();
    
    let currentID = "";
    let lastTopId = null;

    window.onload = function() {
        const sid = localStorage.getItem('bg_id');
        if (sid) verifyDriver(sid);
    };

    function verifyDriver(idFromStorage) {
        const id = idFromStorage || document.getElementById('driverInputID').value.trim();
        if(!id) return;

        db.ref('live_cars/' + id).once('value').then(snap => {
            if(snap.exists()){
                currentID = id;
                document.getElementById('welcomeName').innerText = snap.val().name;
                localStorage.setItem('bg_id', id);
                document.getElementById('loginSection').style.display = "none";
                document.getElementById('statusSection').style.display = "block";
                loadBookings();
            } else {
                alert("ID Not Found!");
            }
        });
    }

    function loadBookings() {
        // Ab hum sirf pehle 4 characters search karenge (Smart Match)
        const filter = document.getElementById('areaFilter').value.toLowerCase();

        db.ref('bookings').limitToLast(100).on('value', snap => {
            const list = document.getElementById('bookingList');
            list.innerHTML = "";
            const data = snap.val();
            if(!data) return list.innerHTML = "No bookings.";

            const keys = Object.keys(data).reverse();
            let count = 0;
            let topK = null;

            keys.forEach(k => {
                const b = data[k];
                const pickup = (b.pickup || "").toLowerCase();
                
                // Flexible match: Agar pickup mein 'azam' hai toh Azamgarh filter mein dikhega
                if(filter === "all" || pickup.includes(filter)) {
                    if(!topK) topK = k;
                    count++;
                    const div = document.createElement('div');
                    div.className = "b-card";
                    div.innerHTML = `
                        <span class="b-fare">₹${b.fare}</span>
                        <span class="b-date">📅 ${b.date} | ⏰ ${b.time}</span>
                        <div class="b-loc">📍 <b>From:</b> ${b.pickup}</div>
                        <div class="b-loc">🏁 <b>To:</b> ${b.drop}</div>
                        <div class="b-footer">
                            <span>👤 ${b.name}</span>
                            <a href="tel:${b.phone}" class="call-btn">📞 Call</a>
                        </div>
                    `;
                    list.appendChild(div);
                }
            });

            if(lastTopId && topK !== lastTopId) {
                document.getElementById('beepSound').play().catch(()=>{});
            }
            lastTopId = topK;
            if(count === 0) list.innerHTML = "<p style='color:#888;'>No bookings for this area.</p>";
        });
    }

    function stopDuty() {
        db.ref('live_cars/' + currentID).update({ status: "offline" }).then(() => {
            localStorage.clear();
            location.reload();
        });
    }
</script>
</body>
</html>
