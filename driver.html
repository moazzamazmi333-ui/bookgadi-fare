<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Live - Secure Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 350px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; transition: 0.3s; }
        .btn-go { background: #1a73e8; }
        .btn-off { background: #dc3545; margin-top: 20px; padding: 10px; font-size: 14px; }
        .status-box { background: #e8f5e9; padding: 15px; border-radius: 10px; display: none; border: 1px solid #c8e6c9; }
        .pulse { height: 10px; width: 10px; background: #2e7d32; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #bookingSection { display: none; margin-top: 20px; text-align: left; }
        .booking-card { background: #fff; border: 1px solid #eee; border-left: 4px solid #1a73e8; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .fare-tag { color: #1e8e3e; font-weight: bold; font-size: 15px; float: right; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.bookgadi.com/logo.png" width="120" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3082/3082383.png'">
        <h3 style="color:#333; margin-top: 10px;">Driver Duty Panel</h3>
        
        <div id="loginSection">
            <input type="text" id="driverInputID" placeholder="Enter Your Driver ID">
            <button class="btn-go" onclick="askPermissionAndStart()">Duty Start Karein</button>
        </div>

        <div id="statusSection" class="status-box">
            <p style="color:#2e7d32; margin: 0; font-weight: bold;"><span class="pulse"></span> Aap Online Hain</p>
            <h4 id="welcomeName"></h4>
            
            <div id="bookingSection">
                <p style="font-weight: bold; color: #333;">New Bookings:</p>
                <div id="bookingList"></div>
            </div>

            <button class="btn-off" onclick="stopDuty()">Duty Offline Karein</button>
        </div>
        <div id="log" style="color:red; font-size:12px; margin-top:10px;"></div>
    </div>

    <script>
        const config = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        var db = firebase.database();
        var watchId = null;
        var lastJobId = null;

        // 1. Notification Permission mangna
        function askPermissionAndStart() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        checkAndStart();
                    } else {
                        alert("Please Allow Notifications to get Job Alerts!");
                        checkAndStart(); // Proceed anyway
                    }
                });
            } else {
                checkAndStart();
            }
        }

        // 2. Beep Sound bajana
        function playBeep() {
            try {
                var context = new (window.AudioContext || window.webkitAudioContext)();
                var osc = context.createOscillator();
                var gain = context.createGain();
                osc.type = "sine";
                osc.frequency.value = 800;
                osc.connect(gain);
                gain.connect(context.destination);
                osc.start();
                setTimeout(() => osc.stop(), 800); // 0.8 second beep
            } catch(e) { console.log("Audio play failed"); }
        }

        // 3. Screen Notification dikhana
        function showNotification(pickup, fare) {
            if (Notification.permission === "granted") {
                new Notification("🚨 New Job Alert - BookGadi", {
                    body: "Pickup: " + pickup + " | Fare: " + fare,
                    icon: "https://static.wixstatic.com/media/843689_497878e241e348adbd167a8cc7462f1b~mv2.png"
                });
            }
        }

        function checkAndStart() {
            var inputID = document.getElementById('driverInputID').value.trim();
            db.ref('live_cars/' + inputID).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    localStorage.setItem('activeDriverId', inputID);
                    startTracking(inputID, snapshot.val().name);
                } else {
                    document.getElementById('log').innerText = "Ghalat ID!";
                }
            });
        }

        function startTracking(id, name) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('statusSection').style.display = "block";
            document.getElementById('bookingSection').style.display = "block";
            document.getElementById('welcomeName').innerText = name;

            // Listen for New Bookings
            db.ref('bookings').limitToLast(1).on('value', (snapshot) => {
                const data = snapshot.val();
                if(!data) return;
                
                const currentId = Object.keys(data)[0];
                const job = data[currentId];

                // Agar nayi booking hai to Beep aur Notification do
                if (lastJobId && lastJobId !== currentId) {
                    playBeep();
                    showNotification(job.pickup, job.fare);
                }
                lastJobId = currentId;
                updateList(data);
            });

            navigator.geolocation.watchPosition(function(pos) {
                db.ref('live_cars/' + id).update({
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    status: "online", last_updated: Date.now()
                });
            }, null, { enableHighAccuracy: true });
        }

        function updateList(data) {
            let html = "";
            Object.keys(data).reverse().forEach(key => {
                const b = data[key];
                html += `<div class="booking-card"><span class="fare-tag">${b.fare}</span>
                         <div>🕒 ${b.time}</div><div>📍 ${b.pickup}</div><div>🏁 ${b.drop}</div></div>`;
            });
            document.getElementById('bookingList').innerHTML = html;
        }

        function stopDuty() {
            var id = localStorage.getItem('activeDriverId');
            db.ref('live_cars/' + id).update({ status: "offline", lat: null, lng: null }).then(() => {
                localStorage.removeItem('activeDriverId');
                location.reload();
            });
        }
    </script>
</body>
</html>
