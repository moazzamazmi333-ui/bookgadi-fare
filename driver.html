<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-go { background: #28a745; }
        .btn-off { background: #dc3545; display: none; margin-top: 20px; }
        #log { color: red; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.bookgadi.com/logo.png" width="100" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3082/3082383.png'">
        <h3>Driver Online Panel</h3>
        
        <div id="loginSection">
            <input type="text" id="name" placeholder="Aapka Naam">
            <input type="tel" id="phone" placeholder="Mobile Number">
            <button class="btn-go" onclick="startDuty()">Duty Start Karein</button>
        </div>

        <div id="statusSection" style="display:none;">
            <p style="color:green; font-weight:bold;">● Aap Online Hain</p>
            <p id="welcome"></p>
            <button class="btn-off" id="offBtn" onclick="stopDuty()">Duty Offline Karein</button>
        </div>
        
        <div id="log"></div>
    </div>

    <script>
        // 1. Firebase Setup
        const config = {
            databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com",
            projectId: "bookgadi-97c98"
        };
        
        try {
            firebase.initializeApp(config);
            var db = firebase.database();
        } catch(e) {
            document.getElementById('log').innerText = "Firebase Error: " + e.message;
        }

        var watchId = null;
        var driverId = "";

        function startDuty() {
            var n = document.getElementById('name').value;
            var p = document.getElementById('phone').value;

            if(n == "" || p.length < 10) {
                alert("Naam aur Number sahi daalein");
                return;
            }

            driverId = p;

            if (navigator.geolocation) {
                // UI Badlein
                document.getElementById('loginSection').style.display = "none";
                document.getElementById('statusSection').style.display = "block";
                document.getElementById('offBtn').style.display = "block";
                document.getElementById('welcome').innerText = "Driver: " + n;

                // Tracking Start
                watchId = navigator.geolocation.watchPosition(function(position) {
                    db.ref('live_cars/' + driverId).set({
                        driverName: n,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        timestamp: Date.now()
                    }).catch(function(err) {
                        document.getElementById('log').innerText = "Database Error: " + err.message;
                    });
                }, function(error) {
                    alert("GPS Permission Error! Settings mein jaakar location allow karein.");
                }, { enableHighAccuracy: true });
            } else {
                alert("Aapka browser GPS support nahi karta.");
            }
        }

        function stopDuty() {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            db.ref('live_cars/' + driverId).remove().then(function() {
                location.reload();
            });
        }
    </script>
</body>
</html>
