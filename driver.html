<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f6; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 20px auto; }
        .btn-go { background: #1a73e8; width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-off { background: #dc3545; width: 100%; padding: 10px; border: none; border-radius: 8px; color: white; margin-top: 15px; }
        .status-box { background: #e8f5e9; padding: 15px; border-radius: 10px; display: none; border: 1px solid #c8e6c9; }
        .pulse { height: 10px; width: 10px; background: #2e7d32; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #bookingList { margin-top: 15px; text-align: left; max-height: 600px; overflow-y: auto; padding: 5px; }
        .booking-card { background: #fff; border: 1px solid #eee; border-left: 5px solid #1a73e8; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); position: relative; }
        .fare-tag { color: #1e8e3e; font-weight: bold; font-size: 18px; display: block; margin-bottom: 5px; }
        .time-tag { color: #d93025; font-size: 13px; font-weight: bold; margin-bottom: 8px; display: block; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #citySelectionArea { display: none; background: #fff9c4; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .no-data { padding: 20px; color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.bookgadi.com/logo.png" width="120" style="margin-bottom:10px;">
        
        <div id="loginSection">
            <h3>Driver Login</h3>
            <input type="text" id="driverInputID" placeholder="Enter Driver ID (e.g. BG001)">
            <button class="btn-go" onclick="verifyDriver()">Verify My ID</button>
        </div>

        <div id="citySelectionArea">
            <h4 style="margin:0 0 10px 0; color:#f57f17;">ID Verified!</h4>
            <label style="font-size:12px; color:#555;">Select Your Working Area:</label>
            <select id="driverCity">
                <option value="ALL">Show All Areas (No Filter)</option>
                <option value="Azamgarh">Azamgarh</option>
                <option value="Lucknow">Lucknow</option>
                <option value="Varanasi">Varanasi</option>
                <option value="Mau">Mau</option>
                <option value="Jaunpur">Jaunpur</option>
            </select>
            <button class="btn-go" style="background:#2e7d32;" onclick="startDuty()">Start My Duty</button>
        </div>

        <div id="statusSection" class="status-box">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <p style="color:#2e7d32; margin: 0; font-weight: bold;"><span class="pulse"></span> Online</p>
                <span id="activeCityDisp" style="background:#1a73e8; color:white; padding:2px 8px; border-radius:4px; font-size:11px;"></span>
            </div>
            <h4 id="welcomeName" style="margin: 10px 0;"></h4>
            <hr style="border:0; border-top:1px solid #ccc;">
            <div id="bookingList">Searching for records...</div>
            <button class="btn-off" onclick="stopDuty()">Go Offline</button>
        </div>
        <div id="log" style="color:red; font-size:13px; margin-top:10px; font-weight:bold;"></div>
    </div>

    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const config = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let lastKnownId = null;
        let isFirstLoad = true;
        let verifiedName = "";

        window.onload = function() {
            const savedID = localStorage.getItem('activeDriverId');
            const savedCity = localStorage.getItem('activeCity');
            if (savedID && savedCity) {
                checkAndRestore(savedID, savedCity);
            }
        };

        function verifyDriver() {
            const id = document.getElementById('driverInputID').value.trim();
            if(!id) return alert("Please enter your Driver ID");
            
            db.ref('live_cars/' + id).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    verifiedName = snapshot.val().name;
                    document.getElementById('loginSection').style.display = "none";
                    document.getElementById('citySelectionArea').style.display = "block";
                } else {
                    document.getElementById('log').innerText = "ID Not Found! Please contact Admin.";
                }
            });
        }

        async function startDuty() {
            const city = document.getElementById('driverCity').value;
            const id = document.getElementById('driverInputID').value.trim();
            
            localStorage.setItem('activeDriverId', id);
            localStorage.setItem('activeCity', city);

            // Permission for sound/notif
            if ("Notification" in window) await Notification.requestPermission();
            const audio = document.getElementById('beepSound');
            audio.play().then(() => { audio.pause(); }).catch(() => {});

            runApp(id, verifiedName, city);
        }

        function checkAndRestore(id, city) {
            db.ref('live_cars/' + id).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    runApp(id, snapshot.val().name, city);
                }
            });
        }

        function runApp(id, name, driverCity) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('citySelectionArea').style.display = "none";
            document.getElementById('statusSection').style.display = "block";
            document.getElementById('welcomeName').innerText = "Welcome, " + name;
            document.getElementById('activeCityDisp').innerText = driverCity;

            // HISTORY FIX: Increased limit to 300 to ensure we find old bookings
            db.ref('bookings').limitToLast(300).on('value', (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('bookingList');
                list.innerHTML = ""; 

                if (!data) {
                    list.innerHTML = "<div class='no-data'>No bookings in database.</div>";
                    return;
                }

                const keys = Object.keys(data).reverse();
                let matchFound = false;
                let topId = null;

                keys.forEach(key => {
                    const b = data[key];
                    const pickup = (b.pickup || "").toLowerCase();
                    const target = driverCity.toLowerCase();

                    // SMART MATCH: Show if City name is inside pickup address OR if "ALL" is selected
                    if (driverCity === "ALL" || pickup.includes(target)) {
                        if(!topId) topId = key;
                        matchFound = true;
                        
                        const item = document.createElement('div');
                        item.className = 'booking-card';
                        item.innerHTML = `
                            <span class="fare-tag">₹${b.fare}</span>
                            <span class="time-tag">📅 ${b.date || 'N/A'} | ⏰ ${b.time || 'N/A'}</span>
                            <div style="font-size:14px; margin-bottom:5px;">📍 <b>From:</b> ${b.pickup}</div>
                            <div style="font-size:14px; margin-bottom:5px;">🏁 <b>To:</b> ${b.drop}</div>
                            <div style="font-size:13px; color:#1a73e8; border-top:1px solid #eee; padding-top:8px; margin-top:8px;">
                                👤 ${b.name} | 📞 <a href="tel:${b.phone}">${b.phone}</a>
                            </div>
                        `;
                        list.appendChild(item);
                    }
                });

                // New Booking Alert
                if (!isFirstLoad && topId && lastKnownId !== topId) {
                    document.getElementById('beepSound').play();
                }

                lastKnownId = topId;
                if(!matchFound) {
                    list.innerHTML = `<div class='no-data'>No history found for "${driverCity}". <br><br> Tip: Try selecting "Show All Areas" to see all bookings.</div>`;
                }
                isFirstLoad = false;
            });

            // Live GPS tracking
            navigator.geolocation.watchPosition((pos) => {
                db.ref('live_cars/' + id).update({
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    status: "online", current_area: driverCity, last_seen: Date.now()
                });
            }, null, { enableHighAccuracy: true });
        }

        function stopDuty() {
            const id = localStorage.getItem('activeDriverId');
            db.ref('live_cars/' + id).update({ status: "offline" }).then(() => {
                localStorage.clear();
                location.reload();
            });
        }
    </script>
</body>
</html>
