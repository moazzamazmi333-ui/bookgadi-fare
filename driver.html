<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f6; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 360px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .btn-go { background: #1a73e8; }
        .btn-off { background: #dc3545; margin-top: 15px; padding: 10px; font-size: 14px; }
        .status-box { background: #e8f5e9; padding: 15px; border-radius: 10px; display: none; border: 1px solid #c8e6c9; }
        .pulse { height: 10px; width: 10px; background: #2e7d32; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #bookingList { margin-top: 15px; text-align: left; }
        .booking-card { background: #fff; border: 1px solid #eee; border-left: 4px solid #1a73e8; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .fare-tag { color: #1e8e3e; font-weight: bold; float: right; }
        .notif-btn { background: #555; font-size: 11px; padding: 5px; margin-top: 10px; width: auto; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.bookgadi.com/logo.png" width="100">
        <h3>Driver Duty Panel</h3>
        
        <div id="loginSection">
            <input type="text" id="driverInputID" placeholder="Enter Your Driver ID">
            <button class="btn-go" onclick="initDuty()">Duty Start Karein</button>
        </div>

        <div id="statusSection" class="status-box">
            <p style="color:#2e7d32; margin: 0; font-weight: bold;"><span class="pulse"></span> BookGadi: You are Online</p>
            <h4 id="welcomeName"></h4>
            
            <button class="notif-btn" onclick="testNotif()">🔔 Test Notification</button>

            <div id="bookingList"></div>
            <button class="btn-off" onclick="stopDuty()">Duty Offline Karein</button>
        </div>
        <div id="log" style="color:red; font-size:12px; margin-top:10px;"></div>
    </div>

    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const config = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let watchId = null;
        let isFirstLoad = true;

        window.onload = function() {
            const savedID = localStorage.getItem('activeDriverId');
            if (savedID) checkAndStart(savedID);
        };

        async function initDuty() {
            const id = document.getElementById('driverInputID').value.trim();
            if(!id) return alert("ID bharein");

            // नोटिफिकेशन परमिशन के लिए नया तरीका
            if ("Notification" in window) {
                const permission = await Notification.requestPermission();
                if(permission !== 'granted') {
                    alert("कृपया Notification Allow करें वरना बुकिंग नहीं पता चलेगी!");
                }
            }
            
            const audio = document.getElementById('beepSound');
            audio.play().then(() => audio.pause()); 
            checkAndStart(id);
        }

        function checkAndStart(inputID) {
            db.ref('live_cars/' + inputID).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    localStorage.setItem('activeDriverId', inputID);
                    startTracking(inputID, snapshot.val().name);
                } else {
                    document.getElementById('log').innerText = "ID Record Nahi Mila!";
                }
            });
        }

        function startTracking(id, name) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('statusSection').style.display = "block";
            document.getElementById('welcomeName').innerText = name;

            db.ref('bookings').limitToLast(5).on('child_added', (snapshot) => {
                const b = snapshot.val();
                const list = document.getElementById('bookingList');
                const item = document.createElement('div');
                item.className = 'booking-card';
                item.innerHTML = `<span class="fare-tag">${b.fare}</span><div>🕒 ${b.time}</div><div>📍 From: ${b.pickup}</div><div>🏁 To: ${b.drop}</div>`;
                list.insertBefore(item, list.firstChild);

                if (!isFirstLoad) {
                    playBeep();
                    showNotification("New Job Alert!", `Pickup: ${b.pickup}`);
                }
            });

            db.ref('bookings').once('value', () => { isFirstLoad = false; });

            watchId = navigator.geolocation.watchPosition((pos) => {
                db.ref('live_cars/' + id).update({
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    status: "online", last_updated: Date.now()
                });
            }, null, { enableHighAccuracy: true });
        }

        function showNotification(title, body) {
            if (Notification.permission === "granted") {
                // यह तरीका मोबाइल पर बेहतर काम करता है
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification(title, {
                        body: body,
                        icon: 'https://www.bookgadi.com/logo.png',
                        vibrate: [200, 100, 200]
                    });
                }).catch(function() {
                    // अगर सर्विस वर्कर न हो तो साधारण तरीका
                    new Notification(title, { body: body });
                });
            }
        }

        function testNotif() {
            playBeep();
            showNotification("Test Success!", "Aapka notification sahi kaam kar raha hai.");
        }

        function playBeep() {
            const audio = document.getElementById('beepSound');
            audio.currentTime = 0;
            audio.play();
        }

        function stopDuty() {
            const id = localStorage.getItem('activeDriverId');
            db.ref('live_cars/' + id).update({ status: "offline", lat: null, lng: null }).then(() => {
                localStorage.removeItem('activeDriverId');
                location.reload();
            });
        }

        // Service Worker Register (नोटिफिकेशन के लिए जरूरी)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Worker Active"));
        }
    </script>
</body>
</html>
