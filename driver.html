<!DOCTYPE html>
<html>
<head>
    <title>BookGadi Driver Live - Secure Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 350px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; transition: 0.3s; }
        .btn-go { background: #1a73e8; }
        .btn-go:active { background: #0d47a1; }
        .btn-off { background: #dc3545; margin-top: 20px; }
        #log { color: #dc3545; font-size: 13px; margin-top: 15px; font-weight: bold; }
        .status-box { background: #e8f5e9; padding: 15px; border-radius: 10px; display: none; border: 1px solid #c8e6c9; }
        .pulse { height: 10px; width: 10px; background: #2e7d32; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.bookgadi.com/logo.png" width="120" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3082/3082383.png'">
        <h3 style="color:#333; margin-top: 10px;">Driver Duty Panel</h3>
        
        <div id="loginSection">
            <p style="font-size: 13px; color: #666;">Admin द्वारा दी गई ID से लॉगिन करें</p>
            <input type="text" id="driverInputID" placeholder="Enter Your Driver ID">
            <button class="btn-go" onclick="checkAndStart()">Duty Start Karein</button>
        </div>

        <div id="statusSection" class="status-box">
            <p style="color:#2e7d32; margin: 0; font-weight: bold;"><span class="pulse"></span> Aap Online Hain</p>
            <h4 id="welcomeName" style="margin: 10px 0; color: #1a73e8;"></h4>
            <p id="displayID" style="font-size: 12px; color: #666;"></p>
            <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
            <p style="font-size: 11px; color: #888;">Note: पेज को बंद न करें, GPS बैकग्राउंड में काम करता रहेगा।</p>
            <button class="btn-off" onclick="stopDuty()">Duty Offline Karein</button>
        </div>
        
        <div id="log"></div>
    </div>

    <script>
        const config = {
            databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com",
            projectId: "bookgadi-97c98"
        };
        firebase.initializeApp(config);
        var db = firebase.database();
        var watchId = null;

        // --- Auto Login Check (On Page Load) ---
        window.onload = function() {
            var savedID = localStorage.getItem('activeDriverId');
            if (savedID) {
                document.getElementById('log').innerText = "Auto-reconnecting...";
                reconnectDriver(savedID);
            }
        };

        function reconnectDriver(id) {
            db.ref('live_cars/' + id).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    var driverData = snapshot.val();
                    startTracking(id, driverData.name);
                } else {
                    localStorage.removeItem('activeDriverId');
                    document.getElementById('log').innerText = "Session expired. Please login again.";
                }
            });
        }

        function checkAndStart() {
            var inputID = document.getElementById('driverInputID').value.trim();
            var log = document.getElementById('log');
            log.innerText = "Checking ID...";

            if(inputID === "") {
                log.innerText = "Kripya Driver ID daalein!";
                return;
            }

            db.ref('live_cars/' + inputID).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    localStorage.setItem('activeDriverId', inputID);
                    var driverData = snapshot.val();
                    startTracking(inputID, driverData.name);
                } else {
                    log.innerText = "Ghalat ID! Admin se sampark karein.";
                }
            }).catch((err) => {
                log.innerText = "Error: " + err.message;
            });
        }

        function startTracking(id, name) {
            if (navigator.geolocation) {
                document.getElementById('loginSection').style.display = "none";
                document.getElementById('statusSection').style.display = "block";
                document.getElementById('welcomeName').innerText = "Namaste, " + name;
                document.getElementById('displayID').innerText = "Driver ID: " + id;
                document.getElementById('log').innerText = "";

                // GPS Tracking with High Accuracy
                watchId = navigator.geolocation.watchPosition(function(position) {
                    db.ref('live_cars/' + id).update({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        status: "online",
                        last_updated: Date.now()
                    });
                }, function(error) {
                    document.getElementById('log').innerText = "GPS Error: Please enable location.";
                }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });

            } else {
                alert("Aapke phone mein GPS support nahi hai.");
            }
        }

        function stopDuty() {
            var id = localStorage.getItem('activeDriverId');
            if (watchId) navigator.geolocation.clearWatch(watchId);

            if (id) {
                db.ref('live_cars/' + id).update({
                    status: "offline",
                    lat: null,
                    lng: null
                }).then(() => {
                    localStorage.removeItem('activeDriverId');
                    location.reload();
                });
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
