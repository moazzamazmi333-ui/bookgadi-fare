<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookGadi AI Chat</title>
    <style>
        /* Chat Box Design */
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .chat-container { 
            width: 100%; 
            max-width: 400px; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            height: 500px; /* Isse height fix ho jayegi */
        }

        .chat-header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; }

        #chatDisplay { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            background: #ffffff; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
        }

        .input-area { border-top: 1px solid #ddd; padding: 10px; display: flex; gap: 5px; background: #eee; }

        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }

        button { background: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }

        .user-msg { background: #d1e7ff; padding: 8px 12px; border-radius: 10px; align-self: flex-end; max-width: 80%; }
        .ai-msg { background: #f1f0f0; padding: 8px 12px; border-radius: 10px; align-self: flex-start; max-width: 80%; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🚖 BookGadi AI Assistant</div>
    
    <div id="chatDisplay">
        <div class="ai-msg">Namaste! Main BookGadi AI hoon. Main aapki kya madad kar sakta hoon?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Kuch likhein...">
        <button onclick="sendMessage()">Bhejein</button>
    </div>
    <button onclick="clearKey()" style="font-size: 10px; background: none; color: gray; border: none; padding: 5px;">Reset API Key</button>
</div>

<script>
    // Universal URL - jo models ko check karega
    async function sendMessage() {
        const inputEl = document.getElementById("userInput");
        const chatDisplay = document.getElementById("chatDisplay");
        const text = inputEl.value.trim();

        if (!text) return;

        // API Key check karein
        let apiKey = localStorage.getItem("bg_key");
        if (!apiKey) {
            apiKey = prompt("Kripya apni Google AI Studio API Key yahan dalein:");
            if (apiKey) {
                localStorage.setItem("bg_key", apiKey);
            } else {
                return;
            }
        }

        // Screen par user ka message dikhayein
        chatDisplay.innerHTML += `<div class="user-msg">${text}</div>`;
        inputEl.value = "";
        chatDisplay.scrollTop = chatDisplay.scrollHeight;

        // API Call (Hum 'gemini-1.5-flash' aur 'v1beta' use kar rahe hain)
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Tum Bookgadi website ke assistant ho. Hinglish mein jawab do. Sawal: " + text }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                chatDisplay.innerHTML += `<div class="ai-msg" style="color:red">Error: ${data.error.message}</div>`;
            } else {
                const aiReply = data.candidates[0].content.parts[0].text;
                chatDisplay.innerHTML += `<div class="ai-msg">${aiReply}</div>`;
            }
        } catch (err) {
            chatDisplay.innerHTML += `<div class="ai-msg" style="color:red">Network Error!</div>`;
        }
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    function clearKey() {
        localStorage.removeItem("bg_key");
        alert("API Key reset ho gayi hai.");
        location.reload();
    }
</script>

</body>
</html>
