<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookGadi AI Assistant</title>
    <style>
        :root { --primary: #1a73e8; --dark: #202124; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; display: flex; justify-content: center; }
        .ai-card { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: var(--dark); color: white; padding: 18px; text-align: center; font-weight: bold; font-size: 18px; }
        #aiResponse { height: 350px; overflow-y: auto; padding: 20px; font-size: 15px; border-bottom: 1px solid #eee; background: #fff; }
        .input-area { padding: 15px; display: flex; gap: 8px; background: #f9f9f9; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-size: 15px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .user-msg { margin-bottom: 15px; text-align: right; color: #444; }
        .ai-msg { margin-bottom: 15px; text-align: left; color: var(--primary); font-weight: 500; }
        .error-msg { color: #d93025; font-size: 13px; text-align: center; background: #fce8e6; padding: 10px; border-radius: 8px; margin: 10px; }
        .key-btn { background: #666; font-size: 11px; padding: 5px 10px; margin: 10px auto; display: block; opacity: 0.6; }
    </style>
</head>
<body>

<div class="ai-card">
    <div class="header">🚖 BookGadi AI Help</div>
    <div id="aiResponse">Namaste! Main BookGadi ka AI assistant hoon. Aap mujhse taxi rates aur booking ke baare mein puch sakte hain.</div>
    <div class="input-area">
        <input type="text" id="aiInput" placeholder="Apna sawal likhein...">
        <button onclick="askBookgadiAI()">Puchhein</button>
    </div>
    <button class="key-btn" onclick="resetKey()">Update API Key</button>
</div>

<script>
    // Browser ki memory se key nikalna
    let SAVED_KEY = localStorage.getItem("bookgadi_safe_key");

    async function askBookgadiAI() {
        const inputEl = document.getElementById("aiInput");
        const chatDisplay = document.getElementById("aiResponse");
        const userInput = inputEl.value.trim();

        if (!userInput) return;

        // Agar key nahi hai, toh mangna
        if (!SAVED_KEY) {
            const userKey = prompt("Google AI Studio se li gayi NAYI API Key yahan dalein (Ise GitHub pe mat dalna):");
            if (userKey && userKey.startsWith("AIza")) {
                localStorage.setItem("bookgadi_safe_key", userKey);
                SAVED_KEY = userKey;
                alert("Key save ho gayi! Ab dobara 'Puchhein' dabayein.");
            } else {
                alert("Kripya sahi API Key dalein jo AI Studio se mili ho.");
            }
            return;
        }

        chatDisplay.innerHTML += `<div class="user-msg"><b>Aap:</b> ${userInput}</div>`;
        inputEl.value = "";
        chatDisplay.scrollTop = chatDisplay.scrollHeight;

        // BookGadi ki details jo AI ko batani hain
        const promptInfo = "Tum www.bookgadi.com ke assistant ho. Rates: Sedan ₹10/km, SUV ₹12/km. Jawab Hinglish mein do.";

        try {
            // Hum 'v1' stable version use kar rahe hain jo 404 nahi dega
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${SAVED_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptInfo + "\nUser: " + userInput }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                chatDisplay.innerHTML += `<div class="error-msg"><b>Google Error:</b> ${data.error.message}<br>Nayi key ke liye 'Update API Key' dabayein.</div>`;
            } else {
                const reply = data.candidates[0].content.parts[0].text;
                chatDisplay.innerHTML += `<div class="ai-msg"><b>AI:</b> ${reply}</div>`;
            }
        } catch (err) {
            chatDisplay.innerHTML += `<div class="error-msg">Network error! Internet check karein.</div>`;
        }
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    function resetKey() {
        localStorage.removeItem("bookgadi_safe_key");
        alert("Purani key hat gayi hai. Nayi key dalne ke liye 'Puchhein' dabayein.");
        location.reload();
    }
</script>

</body>
</html>
