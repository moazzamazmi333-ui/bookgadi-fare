<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookGadi AI Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; display: flex; justify-content: center; height: 100vh; align-items: center; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); display: flex; flex-direction: column; height: 550px; overflow: hidden; }
        .chat-header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; position: relative; }
        #chatDisplay { flex: 1; padding: 15px; overflow-y: auto; background: #ffffff; display: flex; flex-direction: column; gap: 10px; }
        .user-msg { background: #d1e7ff; color: #000; padding: 10px; border-radius: 10px 10px 0 10px; align-self: flex-end; max-width: 80%; font-size: 14px; }
        .ai-msg { background: #f1f0f0; color: #000; padding: 10px; border-radius: 10px 10px 10px 0; align-self: flex-start; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .input-area { border-top: 1px solid #ddd; padding: 10px; display: flex; gap: 8px; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #1a73e8; color: white; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .error-msg { color: #d93025; font-size: 12px; background: #fce8e6; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🚖 BookGadi AI
        <span onclick="resetKey()" style="font-size:10px; cursor:pointer; opacity:0.7; position:absolute; right:10px; top:18px;">Reset Key</span>
    </div>
    <div id="chatDisplay">
        <div class="ai-msg">Namaste! Main BookGadi AI hoon. Main aapki kya madad kar sakta hoon?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Sawal likhein..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Bhejein</button>
    </div>
</div>

<script>
    function handleEnter(e) { if (e.key === "Enter") sendMessage(); }

    async function sendMessage() {
        const inputEl = document.getElementById("userInput");
        const chatDisplay = document.getElementById("chatDisplay");
        const text = inputEl.value.trim();
        if (!text) return;

        let apiKey = localStorage.getItem("bg_key");
        if (!apiKey) {
            apiKey = prompt("AIzaSyAO4VOlOAWGtHjKkNUrMHvgtdldTnUqAbk");
            if (apiKey) localStorage.setItem("bg_key", apiKey); else return;
        }

        chatDisplay.innerHTML += `<div class="user-msg">${text}</div>`;
        inputEl.value = "";
        
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "ai-msg";
        loadingDiv.innerText = "Typing...";
        chatDisplay.appendChild(loadingDiv);
        chatDisplay.scrollTop = chatDisplay.scrollHeight;

        // --- TRYING MULTIPLE MODEL NAMES FOR STABILITY ---
        const modelsToTry = [
            "gemini-1.5-flash-latest", // Modern Flash
            "gemini-1.5-flash",        // Standard Alias
            "gemini-pro"               // Reliable Fallback
        ];

        let success = false;
        for (let modelName of modelsToTry) {
            if (success) break;
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "You are the AI of BookGadi.com. Reply in Hinglish. User says: " + text }] }]
                    })
                });

                const data = await response.json();

                if (!data.error && data.candidates) {
                    loadingDiv.innerText = data.candidates[0].content.parts[0].text;
                    success = true;
                } else {
                    console.log(`Model ${modelName} failed, trying next...`);
                }
            } catch (err) {
                console.error(`Error with ${modelName}:`, err);
            }
        }

        if (!success) {
            loadingDiv.className = "error-msg";
            loadingDiv.innerText = "Maaf kijiye, API connect nahi ho rahi. Kripya API Key check karein ya thodi der baad try karein.";
        }
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    function resetKey() {
        localStorage.removeItem("bg_key");
        alert("API Key reset ho gayi.");
        location.reload();
    }
</script>

</body>
</html>
