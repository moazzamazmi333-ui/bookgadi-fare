<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookGadi - AI Powered Taxi</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
/* CSS Styling (Vahi purana wala) */
:root { --primary: #1a73e8; --success: #25D366; --dark: #202124; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #f8f9fa; padding-bottom: 70px; }
.card { width: 100%; max-width: 500px; background: #fff; border-radius: 0 0 24px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin: auto; }
#map { height: 350px; width: 100%; }
.content { padding: 20px; }
.input-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; }
.main-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: #fff; background: var(--dark); }
#aiWidget { background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-top: 20px; }
#aiResponse { max-height: 150px; overflow-y: auto; font-size: 14px; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
</style>
</head>
<body>

<div class="card">
    <div id="map"></div>
    <div class="content">
        <input id="pickup" class="input-box" placeholder="Pickup Location">
        <input id="drop" class="input-box" placeholder="Drop Location">
        <button class="main-btn" onclick="calculateFare()">Check Kiraaya</button>
        <div id="result"></div>

        <div id="aiWidget">
            <h4 style="margin-bottom:10px;">🤖 BookGadi AI Help</h4>
            <div id="aiResponse">Aap Azamgarh/Lucknow ka rate puch sakte hain...</div>
            <div style="display: flex; gap: 5px;">
                <input id="aiInput" class="input-box" style="margin-bottom:0;" placeholder="Ask something...">
                <button onclick="askBookgadiAI()" style="background:var(--primary); color:white; border:none; padding:0 15px; border-radius:10px;">Puchhein</button>
            </div>
        </div>
    </div>
</div>

<script>
/* [SECTION: CONFIG] */
const firebaseConfig = { databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);

// AAPKI KEY YAHAN (Maps aur Gemini dono ke liye ek hi use kar rahe hain aap)
const API_KEY = "AIzaSyA0JK_UMO3gbQgDKJRl0zw6lQf3vhNSbz4"; 

/* [SECTION: SMART AI LOGIC] */
async function askBookgadiAI() {
    const inputEl = document.getElementById("aiInput");
    const chatDisplay = document.getElementById("aiResponse");
    const userInput = inputEl.value.trim();
    if (!userInput) return;

    chatDisplay.innerHTML += `<div><b>Aap:</b> ${userInput}</div>`;
    inputEl.value = "";

    // Hum 3 alag-alag raste try karenge (Backup Strategy)
    const urls = [
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`,
        `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`
    ];

    let success = false;

    for (let url of urls) {
        if (success) break;
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Tum Bookgadi taxi assistant ho. Answer in Hinglish. User asks: " + userInput }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                chatDisplay.innerHTML += `<div style="color:var(--primary)"><b>AI:</b> ${reply}</div>`;
                success = true;
            }
        } catch (err) {
            console.log("This URL failed, trying next...");
        }
    }

    if (!success) {
        chatDisplay.innerHTML += `<div style="color:red">Google Error: API Key abhi bhi activate nahi hui hai. Google Console mein 'Generative Language API' Enable karein.</div>`;
    }
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
}

/* [SECTION: MAPS LOGIC] */
function initMap() {
    const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 26.8467, lng: 80.9462 },
        zoom: 7
    });
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
