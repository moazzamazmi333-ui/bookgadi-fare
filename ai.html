<!DOCTYPE html>
<html>
<head>
    <title>BookGadi AI Test</title>
</head>
<body>
    <h2>BookGadi AI Assistant</h2>
    <div id="chat" style="border:1px solid #ccc; height:200px; overflow-y:scroll; padding:10px; margin-bottom:10px;"></div>
    <input type="text" id="userInput" placeholder="Kuch puchhein...">
    <button onclick="askAI()">Send</button>

    <script>
        // 1. APNI NAYI KEY YAHAN DALEIN (Quotation marks ke beech mein)
        const MY_KEY = "AIzaSyA0JK_UMO3gbQgDKJRl0zw6lQf3vhNSbz4"; 

        async function askAI() {
            const input = document.getElementById("userInput").value;
            const chat = document.getElementById("chat");
            chat.innerHTML += "<div><b>Aap:</b> " + input + "</div>";

            // 2. YEH URL BILKUL SAHI HAI (v1beta + gemini-1.5-flash)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_KEY}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: input }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    // Agar 404 aaye toh yahan message dikhega
                    chat.innerHTML += "<div style='color:red'><b>Error:</b> " + data.error.message + "</div>";
                } else {
                    const reply = data.candidates[0].content.parts[0].text;
                    chat.innerHTML += "<div style='color:blue'><b>AI:</b> " + reply + "</div>";
                }
            } catch (e) {
                chat.innerHTML += "<div style='color:red'>Connection Failed!</div>";
            }
        }
    </script>
</body>
</html>
