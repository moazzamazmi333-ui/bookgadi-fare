<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookGadi AI Assistant</title>
    <style>
        :root { --primary: #1a73e8; --dark: #202124; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .ai-card { width: 100%; max-width: 400px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--dark); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #aiResponse { height: 300px; overflow-y: auto; padding: 15px; font-size: 14px; line-height: 1.5; border-bottom: 1px solid #eee; }
        .input-area { padding: 10px; display: flex; gap: 5px; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .user-msg { margin-bottom: 12px; color: #333; }
        .ai-msg { margin-bottom: 12px; color: var(--primary); font-weight: 500; }
        .error-msg { color: red; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="ai-card">
    <div class="header">🤖 BookGadi AI Help</div>
    <div id="aiResponse">Hello! Main BookGadi AI hoon. Azamgarh ya Lucknow taxi ke rates puchhein.</div>
    <div class="input-area">
        <input type="text" id="aiInput" placeholder="Kuch puchhein...">
        <button onclick="askBookgadiAI()">Puchhein</button>
    </div>
    <div id="setupArea" style="padding: 10px; text-align: center;">
        <button onclick="resetKey()" style="background:#666; font-size: 10px;">Update API Key</button>
    </div>
</div>

<script>
    // 1. Key ko browser ke local memory se uthana (GitHub pe leak nahi hogi)
    let GEMINI_API_KEY = localStorage.getItem("bookgadi_ai_key");

    async function askBookgadiAI() {
        const inputEl = document.getElementById("aiInput");
        const chatDisplay = document.getElementById("aiResponse");
        const userInput = inputEl.value.trim();

        if (!userInput) return;

        // Agar key nahi hai, toh mangna
        if (!GEMINI_API_KEY) {
            const userKey = prompt("Google AI Studio se li gayi API Key yahan paste karein:");
            if (userKey) {
                localStorage.setItem("bookgadi_ai_key", userKey);
                GEMINI_API_KEY = userKey;
                alert("Key save ho gayi hai! Ab aap puch sakte hain.");
            }
            return;
        }

        chatDisplay.innerHTML += `<div class="user-msg"><b>Aap:</b> ${userInput}</div>`;
        inputEl.value = "";
        chatDisplay.scrollTop = chatDisplay.scrollHeight;

        const systemPrompt = "Tum Bookgadi ke assistant ho. Azamgarh aur Lucknow ke liye taxi rates: SUV ₹12/km, Sedan ₹10/km. Polite Hinglish mein jawab do.";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: systemPrompt + "\nUser Question: " + userInput }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                if (data.error.code === 400 || data.error.code === 404) {
                    chatDisplay.innerHTML += `<div class="error-msg">Error: Aapki Key sahi nahi hai ya API enable nahi hai.</div>`;
                } else {
                    chatDisplay.innerHTML += `<div class="error-msg">Error: ${data.error.message}</div>`;
                }
            } else {
                const reply = data.candidates[0].content.parts[0].text;
                chatDisplay.innerHTML += `<div class="ai-msg"><b>AI:</b> ${reply}</div>`;
            }
        } catch (err) {
            chatDisplay.innerHTML += `<div class="error-msg">Network error! Internet check karein.</div>`;
        }
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    function resetKey() {
        localStorage.removeItem("bookgadi_ai_key");
        alert("Purani key delete ho gayi. Nayi key dalne ke liye 'Puchhein' dabayein.");
        location.reload();
    }
</script>

</body>
</html>
