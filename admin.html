<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>BookGadi Admin - Secure Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; }
        
        /* Login Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a73e8; display: flex; justify-content: center; align-items: center;
            z-index: 9999; color: white;
        }
        .login-box { background: white; padding: 30px; border-radius: 15px; color: #333; text-align: center; width: 300px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-login { background: #28a745; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Main Admin UI */
        #adminUI { display: none; flex-direction: row; height: 100vh; width: 100%; }
        #sidebar { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #1a73e8; color: white; text-align: center; }
        #driverList { flex: 1; overflow-y: auto; padding: 10px; }
        #map { flex: 1; height: 100%; }

        .driver-card { 
            padding: 15px; margin-bottom: 10px; border-radius: 10px; 
            background: #fff; border: 1px solid #eee; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .driver-card:hover { background: #e8f0fe; }
        .status-dot { width: 10px; height: 10px; background: #28a745; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <img src="https://www.bookgadi.com/logo.png" width="100">
            <h3>Admin Access</h3>
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
            <button class="btn-login" onclick="checkPass()">Unlock Panel</button>
            <p id="err" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div id="adminUI">
        <div id="sidebar">
            <div class="sidebar-header">
                <strong>Live Fleet Tracker</strong>
            </div>
            <div id="driverList"></div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        // अपना पासवर्ड यहाँ सेट करें
        const SECRET_PASSWORD = "9651191446"; 

        function checkPass() {
            const pass = document.getElementById('adminPass').value;
            if(pass === SECRET_PASSWORD) {
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('adminUI').style.display = "flex";
                initMap(); // पासवर्ड सही होने पर ही मैप लोड होगा
            } else {
                document.getElementById('err').innerText = "Wrong Password! Access Denied.";
            }
        }

        const firebaseConfig = {
            databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com",
            projectId: "bookgadi-97c98"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, markers = {};

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8,
                center: { lat: 26.5000, lng: 82.1000 }
            });
            startTracking();
        }

        function startTracking() {
            db.ref('live_cars').on('value', (snapshot) => {
                const allCars = snapshot.val();
                const listDiv = document.getElementById('driverList');
                listDiv.innerHTML = "";

                if (!allCars) {
                    listDiv.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">No drivers online.</p>';
                    for (let id in markers) markers[id].setMap(null);
                    markers = {};
                    return;
                }

                Object.keys(allCars).forEach(id => {
                    const data = allCars[id];
                    const pos = { lat: data.lat, lng: data.lng };

                    // List Item
                    const card = document.createElement('div');
                    card.className = 'driver-card';
                    card.innerHTML = `<div><b>${data.driverName}</b><br><small>${id}</small></div><div class="status-dot"></div>`;
                    card.onclick = () => { map.setCenter(pos); map.setZoom(16); };
                    listDiv.appendChild(card);

                    // Marker
                    if (!markers[id]) {
                        markers[id] = new google.maps.Marker({
                            position: pos, map: map, label: data.driverName[0],
                            icon: { url: "https://cdn-icons-png.flaticon.com/512/3082/3082383.png", scaledSize: new google.maps.Size(40, 40) }
                        });
                    } else {
                        markers[id].setPosition(pos);
                    }
                });
            });
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&callback=initMap" async defer></script>
</body>
</html>
