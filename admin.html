<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>BookGadi Admin - PC Fixed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* ... (आपका पिछला CSS यहाँ रहेगा) ... */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; }
        #adminUI { display: none; height: 100vh; }
        #sidebar { width: 350px; background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        #map { flex: 1; background: #eee; }
        .login-box { background: white; padding: 30px; border-radius: 15px; width: 320px; margin: 100px auto; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3>Admin Panel</h3>
            <input type="password" id="adminPass" style="width:100%; padding:10px; margin:10px 0;" placeholder="पासवर्ड डालें">
            <button onclick="checkPass()" style="width:100%; padding:10px; background:#28a745; color:white; border:none; cursor:pointer;">Unlock</button>
            <p id="err" style="color:red;"></p>
        </div>
    </div>

    <div id="adminUI" style="display:none; flex-direction:row;">
        <div id="sidebar">
            <div style="padding:20px; background:#1a73e8; color:white;"><strong>BookGadi Fleet</strong></div>
            <div id="driverList"></div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const SECRET_PASSWORD = "9651191446"; 

        function checkPass() {
            const pass = document.getElementById('adminPass').value;
            if(pass === SECRET_PASSWORD) {
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('adminUI').style.display = "flex";
                // मैप को तब लोड करें जब पासवर्ड सही हो जाए
                loadGoogleMaps();
            } else {
                document.getElementById('err').innerText = "Wrong Password!";
            }
        }

        const firebaseConfig = {
            databaseURL: "https://bookgadi-97c98-default-rtdb.firebaseio.com",
            projectId: "bookgadi-97c98"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, markers = {};

        function loadGoogleMaps() {
            const script = document.createElement('script');
            script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM";
            script.onload = initMap;
            document.head.appendChild(script);
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8,
                center: { lat: 26.8467, lng: 80.9462 }
            });
            startTracking();
        }

        function startTracking() {
            db.ref('live_cars').on('value', (snapshot) => {
                const allCars = snapshot.val();
                const listDiv = document.getElementById('driverList');
                listDiv.innerHTML = "";
                
                if (!allCars) return;

                Object.keys(allCars).forEach(id => {
                    const data = allCars[id];
                    if(data.status === "online" && data.lat) {
                        const pos = { lat: data.lat, lng: data.lng };
                        
                        // लिस्ट में नाम जोड़ना
                        const item = document.createElement('div');
                        item.style.padding = "15px; border-bottom:1px solid #eee; cursor:pointer";
                        item.innerHTML = `<b>${data.name || 'Driver'}</b><br><small>${id}</small>`;
                        item.onclick = () => map.setCenter(pos);
                        listDiv.appendChild(item);

                        // मैप पर मार्कर
                        if (!markers[id]) {
                            markers[id] = new google.maps.Marker({ position: pos, map: map, title: data.name });
                        } else {
                            markers[id].setPosition(pos);
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
