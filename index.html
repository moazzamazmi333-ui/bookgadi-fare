<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookGadi - Best SUV & Sedan Taxi Fare Calculator</title>

<style>
:root {
  --primary: #1a73e8;
  --success: #25D366;
  --dark: #202124;
  --warning: #f4b400;
}

*{box-sizing:border-box;margin:0;padding:0;font-family: 'Segoe UI', sans-serif;}

body {
  background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
}

.card{
  width: 100%;
  max-width: 450px;
  background: #fff;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

#map{height:300px; width:100%; background:#e5e3df;}

.content{padding: 20px;}

.input-box {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  border-radius: 12px;
  border: 1.5px solid #eee;
  margin-bottom: 10px;
  outline: none;
}

.btn-loc {
  background: #f1f3f4;
  color: var(--primary);
  border: none;
  padding: 8px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  margin-bottom: 15px;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid #eee;
  margin-bottom: 15px;
  font-weight: 600;
}

.trip-type {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  display: none; 
}

.trip-type label {
  flex: 1;
  padding: 10px;
  background: #f8f9fa;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.trip-type input { display: none; }
.trip-type label:has(input:checked) { background: var(--primary); color: #fff; }

.main-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.btn-calc { background: var(--dark); color: #fff; }
.btn-wa { background: var(--success); color: #fff; margin-top: 10px; display: none; }

#result { margin-top: 15px; }
.fare-card {
  padding: 15px;
  background: #f0f7ff;
  border-radius: 12px;
  border-left: 5px solid var(--primary);
}

.info-note {
  font-size: 12px;
  color: #666;
  margin-top: 8px;
  line-height: 1.4;
  background: #fff9e6;
  padding: 8px;
  border-radius: 8px;
  border: 1px dashed var(--warning);
}

#userForm { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
</style>
</head>

<body>

<div class="card">
  <div id="map"></div>

  <div class="content">
    <input id="pickup" class="input-box" placeholder="Kahan se? (Pickup Location)">
    <button class="btn-loc" id="locBtn" onclick="useMyLocation()">📍 Current Location Use Karein</button>
    
    <input id="drop" class="input-box" placeholder="Kahan tak? (Drop Location)">

    <select id="vehicle">
      <option value="12">🚙 SUV (₹12/km)</option>
      <option value="10">🚕 Sedan (₹10/km)</option>
    </select>

    <div id="tripOptions" class="row trip-type">
      <label><input type="radio" name="trip" id="oneway" checked onchange="calculateFare()"> One Way</label>
      <label><input type="radio" name="trip" id="roundtrip" onchange="calculateFare()"> Round Trip</label>
    </div>

    <button class="main-btn btn-calc" onclick="calculateFare()">Kiraaya Dekhein</button>

    <div id="result"></div>

    <button id="waBtn" class="main-btn btn-wa" onclick="openBooking()">💬 Booking Details Bharein</button>

    <div id="userForm">
      <input id="custName" class="input-box" placeholder="Aapka Naam">
      <input id="custPhone" class="input-box" type="tel" placeholder="Mobile Number">
      
      <div style="display: flex; gap: 10px;">
        <input id="rideDate" class="input-box" type="date" style="flex: 1.2;">
        <input id="rideTime" class="input-box" type="time" style="flex: 0.8;">
      </div>

      <button class="main-btn btn-wa" style="display:block" onclick="sendWhatsApp()">Confirm & WhatsApp Book</button>
    </div>
  </div>
</div>

<script>
let map, geocoder, pickupAC, dropAC, pickupPlace, dropPlace, directionsRenderer, directionsService;
let lastKm = 0;

function initMap(){
  document.getElementById('rideDate').valueAsDate = new Date();
  geocoder = new google.maps.Geocoder();
  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({ polylineOptions: { strokeColor: "#1a73e8", strokeWeight: 5 } });

  map = new google.maps.Map(document.getElementById("map"),{
    center:{lat:26.0739, lng:83.1859}, zoom:9, zoomControl: true, fullscreenControl: true, streetViewControl: false, mapTypeControl: false
  });
  directionsRenderer.setMap(map);

  pickupAC = new google.maps.places.Autocomplete(document.getElementById("pickup"),{componentRestrictions:{country:"in"}});
  dropAC   = new google.maps.places.Autocomplete(document.getElementById("drop"),{componentRestrictions:{country:"in"}});
  
  pickupAC.addListener("place_changed",()=> { pickupPlace = pickupAC.getPlace(); });
  dropAC.addListener("place_changed",()=> { dropPlace = dropAC.getPlace(); });
}

function useMyLocation(){
  const btn = document.getElementById("locBtn");
  btn.innerText = "⌛ Finding...";
  navigator.geolocation.getCurrentPosition((pos) => {
    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    geocoder.geocode({ location: latlng }, (results, status) => {
      if (status === "OK" && results[0]) {
        document.getElementById("pickup").value = results[0].formatted_address;
        pickupPlace = results[0];
        map.setCenter(latlng); map.setZoom(15);
        btn.innerText = "✅ Done";
      }
    });
  }, () => { alert("Allow Location Access"); btn.innerText = "📍 Retry"; });
}

function calculateFare(){
  if(!pickupPlace || !dropPlace) { alert("Dono location select karein"); return; }
  directionsService.route({
    origin: pickupPlace.formatted_address || pickupPlace.geometry.location,
    destination: dropPlace.formatted_address || dropPlace.geometry.location,
    travelMode: 'DRIVING'
  }, (res, status) => {
    if (status === 'OK') {
      directionsRenderer.setDirections(res);
      lastKm = res.routes[0].legs[0].distance.value / 1000;
      updateUI();
    }
  });
}

function updateUI(){
  const rate = Number(document.getElementById("vehicle").value);
  const isRound = document.getElementById("roundtrip").checked;
  const isLocal = lastKm < 5; 
  document.getElementById("tripOptions").style.display = isLocal ? "none" : "flex";
  
  let fare = isRound ? Math.round(lastKm * rate * 2 + 300) : Math.round(250 + lastKm * rate);
  if(isLocal) fare = 500;

  document.getElementById("result").innerHTML = `
    <div class="fare-card">
      <b>Duri:</b> ${lastKm.toFixed(1)} km<br>
      <b>Kiraaya:</b> <span id="finalFare" style="font-size:22px; color:var(--primary)">₹${fare}</span>
      <div class="info-note">
        ⚠️ <b>Note:</b> Toll, State Tax & Parking extra.
      </div>
    </div>`;
  document.getElementById("waBtn").style.display = "block";
}

function openBooking(){ document.getElementById("userForm").style.display = "block"; }

function sendWhatsApp(){
  const name = document.getElementById("custName").value;
  const phone = document.getElementById("custPhone").value;
  const date = document.getElementById("rideDate").value;
  const time = document.getElementById("rideTime").value;
  const vehicle = document.getElementById("vehicle").options[document.getElementById("vehicle").selectedIndex].text;
  const isRound = document.getElementById("roundtrip").checked;
  const tripType = isRound ? "Round Trip" : "One Way";

  if(!name || !phone || !date || !time) { alert("Details bharein"); return; }
  
  const fareVal = document.getElementById("finalFare").innerText;
  const pickupAddr = document.getElementById("pickup").value;
  const dropAddr = document.getElementById("drop").value;

  // GOOGLE MAPS NAVIGATION LINK FORMAT (Best for WhatsApp)
  const pickupLink = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(pickupAddr);
  const dropLink = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dropAddr);

  const msg = `*BookGadi Booking Request*%0A` +
              `----------------------------%0A` +
              `*Vehicle:* ${vehicle}%0A` +
              `*Trip:* ${tripType}%0A` +
              `*Name:* ${name}%0A` +
              `*Mobile:* ${phone}%0A` +
              `*Date:* ${date} | ${time}%0A` +
              `*Fare:* ${fareVal}%0A` +
              `----------------------------%0A` +
              `*Pickup Location:*%0A${pickupLink}%0A%0A` +
              `*Drop Location:*%0A${dropLink}`;

  window.open(`https://wa.me/919651191446?text=${msg}`, "_blank");
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
