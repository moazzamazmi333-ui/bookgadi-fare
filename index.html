<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookGadi - Best SUV & Sedan Taxi Fare Calculator | Book via WhatsApp</title>
<meta name="description" content="BookGadi offers the best taxi fare calculator for SUV & Sedan. Get instant quotes for outstation one-way, round trips, and local packages in Lucknow.">
<meta name="keywords" content="BookGadi, Taxi Fare Calculator, Online Taxi Booking, SUV Taxi, Sedan Taxi, Outstation Cabs, BookGadi Lucknow">
<meta name="author" content="BookGadi">
<link rel="canonical" href="https://www.bookgadi.com">
<script type="application/ld+json">

  "@type": "TaxiService",

    "telephone": "+919651191446"
  },
  "areaServed": "India",
  "description": "Premium SUV and Sedan taxi services for local and outstation trips."
}
</script>
<style>
:root {
  --primary: #1a73e8;
  --success: #25D366;
  --dark: #202124;
  --warning: #f4b400;
}
*{box-sizing:border-box;margin:0;padding:0;font-family: 'Segoe UI', sans-serif;}
body {
  background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
}
.card{
  width: 100%;
  max-width: 450px;
  background: #fff;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}
#map{height:300px; width:100%; background:#e5e3df;}
.content{padding: 20px;}
.input-box {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  border-radius: 12px;
  border: 1.5px solid #eee;
  margin-bottom: 10px;
  outline: none;
}
.btn-loc {
  background: #f1f3f4;
  color: var(--primary);
  border: none;
  padding: 8px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  margin-bottom: 15px;
}
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid #eee;
  margin-bottom: 15px;
  font-weight: 600;
}
.trip-type {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
.trip-type label {
  flex: 1;
  padding: 10px;
  background: #f8f9fa;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.trip-type input { display: none; }
.trip-type label:has(input:checked) { background: var(--primary); color: #fff; }
.main-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.btn-calc { background: var(--dark); color: #fff; }
.btn-wa { background: var(--success); color: #fff; margin-top: 10px; }
#result { margin-top: 15px; }
.fare-card {
  padding: 15px;
  background: #f0f7ff;
  border-radius: 12px;
  border-left: 5px solid var(--primary);
}
.info-note {
  font-size: 12px;
  color: #666;
  margin-top: 8px;
  line-height: 1.4;
  background: #fff9e6;
  padding: 8px;
  border-radius: 8px;
  border: 1px dashed var(--warning);
}
#userForm { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
.seo-h1 { position: absolute; left: -9999px; }
</style>
</head>
<body>
<h1 class="seo-h1">BookGadi Taxi Fare Calculator Lucknow - SUV & Sedan Services</h1>
<div class="card">
  <div id="map"></div>
  <div class="content">
    <input id="pickup" class="input-box" placeholder="Kahan se? (Pickup Location)">
    <button class="btn-loc" id="locBtn" onclick="useMyLocation()">📍 Current Location Use Karein</button>
    <input id="drop" class="input-box" placeholder="Kahan tak? (Drop Location)">
    <select id="vehicle">
      <option value="12">🚙 SUV (₹12/km)</option>
      <option value="10">🚕 Sedan (₹10/km)</option>
    </select>
    <div id="tripOptions" class="trip-type">
      <label><input type="radio" name="trip" id="oneway" checked onchange="calculateFare()"> One Way</label>
      <label><input type="radio" name="trip" id="roundtrip" onchange="calculateFare()"> Round Trip</label>
    </div>
    <button class="main-btn btn-calc" onclick="calculateFare()">Kiraaya Dekhein</button>
    <div id="result"></div>
    <button id="waBtn" class="main-btn btn-wa" onclick="openBooking()" style="display:none">💬 Booking WhatsApp Karein</button>
    
    <div id="userForm">
      <input id="custName" class="input-box" placeholder="Aapka Naam">
      <input id="custPhone" class="input-box" type="tel" placeholder="Mobile Number (10 digit)" pattern="[0-9]{10}">
      <div style="display: flex; gap: 10px;">
        <input id="rideDate" class="input-box" type="date" style="flex: 1.2;">
        <input id="rideTime" class="input-box" type="time" style="flex: 0.8;">
      </div>
      <button class="main-btn btn-wa" onclick="sendWhatsApp()">Confirm & WhatsApp Book Karein</button>
    </div>
  </div>
</div>

<script>
let map, geocoder, pickupAC, dropAC, directionsRenderer, directionsService;
let lastKm = 0;

function initMap() {
    document.getElementById('rideDate').valueAsDate = new Date();
    geocoder = new google.maps.Geocoder();
    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({ 
        polylineOptions: { strokeColor: "#1a73e8", strokeWeight: 5 } 
    });

    // आज़मगढ़ का सेंटर (ताकि इसके पास के गाँव पहले दिखें)
    const azmCenter = { lat: 26.0667, lng: 83.1833 };

    map = new google.maps.Map(document.getElementById("map"), {
        center: azmCenter,
        zoom: 12, // थोड़ा ज़्यादा ज़ूम ताकि पास के इलाके दिखें
        zoomControl: true,
        streetViewControl: false,
        mapTypeControl: false
    });
    directionsRenderer.setMap(map);

    // सर्च सेटिंग्स
    const options = {
        componentRestrictions: { country: "in" },
        // locationBias: यह Google को बताता है कि पहले यहाँ ढूंढो
        locationBias: { radius: 50000, center: azmCenter }, 
        fields: ["formatted_address", "geometry", "name"],
        strictBounds: false // इसे false रखें ताकि बाहर के शहर भी मिल सकें, पर प्राथमिकता लोकल को मिले
    };

    pickupAC = new google.maps.places.Autocomplete(document.getElementById("pickup"), options);
    dropAC = new google.maps.places.Autocomplete(document.getElementById("drop"), options);

    // ब्राउज़र से यूज़र की करंट लोकेशन लेकर सर्च को और सटीक बनाना
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
            const userPos = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
            };
            const userBias = { radius: 20000, center: userPos };
            // सर्च को यूज़र की लोकेशन के हिसाब से अपडेट करना
            pickupAC.setOptions({ locationBias: userBias });
            dropAC.setOptions({ locationBias: userBias });
        });
    }
}
function useMyLocation(){
  const btn = document.getElementById("locBtn");
  btn.innerText = "⌛ Dhoondh rahe hain...";
  navigator.geolocation.getCurrentPosition((pos) => {
    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    geocoder.geocode({ location: latlng }, (results, status) => {
      if (status === "OK" && results[0]) {
        document.getElementById("pickup").value = results[0].formatted_address;
        map.setCenter(latlng);
        map.setZoom(15);
        btn.innerText = "✅ Location Set";
      } else {
        btn.innerText = "📍 Retry";
        alert("Location nahi mili");
      }
    });
  }, () => {
    alert("Location access allow karein");
    btn.innerText = "📍 Current Location";
  });
}

function calculateFare(){
  const p_val = document.getElementById("pickup").value.trim();
  const d_val = document.getElementById("drop").value.trim();
  if(!p_val || !d_val) {
    alert("Pickup aur Drop dono locations daalein");
    return;
  }

  directionsService.route({
    origin: p_val,
    destination: d_val,
    travelMode: 'DRIVING'
  }, (res, status) => {
    if (status === 'OK') {
      directionsRenderer.setDirections(res);
      lastKm = res.routes[0].legs[0].distance.value / 1000;
      updateUI();
    } else {
      alert("Route nahi mila – locations check karein");
    }
  });
}

function updateUI(){
  const rate = Number(document.getElementById("vehicle").value);
  const isRound = document.getElementById("roundtrip").checked;
  const isLocal = lastKm < 5;

  document.getElementById("tripOptions").style.display = isLocal ? "none" : "flex";

  let fare = isRound ? Math.round(lastKm * rate * 2 + 300) : Math.round(250 + lastKm * rate);
  if(isLocal) fare = 500;

  document.getElementById("result").innerHTML = `
    <div class="fare-card">
      <b>Distance:</b> ${lastKm.toFixed(1)} km<br>
      <b>Estimated Fare:</b> <span id="finalFare" style="font-size:22px; color:var(--primary)">₹${fare}</span>
      <div class="info-note">
        ⚠️ Toll, State Tax, Parking aur Driver allowance alag se dena hoga.
      </div>
    </div>`;

  document.getElementById("waBtn").style.display = "block";
}

function openBooking(){
  document.getElementById("userForm").style.display = "block";
  document.getElementById("waBtn").style.display = "none";
}

function sendWhatsApp(){
  const name      = document.getElementById("custName").value.trim();
  const phone     = document.getElementById("custPhone").value.trim();
  const date      = document.getElementById("rideDate").value;
  const time      = document.getElementById("rideTime").value;
  const vehicle   = document.getElementById("vehicle").options[document.getElementById("vehicle").selectedIndex].text;
  const tripType  = document.getElementById("roundtrip").checked ? "Round" : "One Way";
  let pickupVal   = document.getElementById("pickup").value.trim();
  let dropVal     = document.getElementById("drop").value.trim();
  const fareVal   = document.getElementById("finalFare").innerText;

  if(!name || !phone || phone.length !== 10 || !/^\d{10}$/.test(phone) || !date || !time || !pickupVal || !dropVal) {
    alert("Saari details sahi se bharein (10 digit mobile number)");
    return;
  }

  // Fix for + in Plus Codes: replace + with %2B BEFORE encoding the URL parts
  pickupVal = pickupVal.replace(/\+/g, '%2B');
  dropVal   = dropVal.replace(/\+/g, '%2B');

  const routeLink = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pickupVal)}&destination=${encodeURIComponent(dropVal)}&travelmode=driving`;

  // Concise + double line breaks for better spacing + bold where useful
  const msg = `*BookGadi Booking*\n\n` +
              `🚗 *${vehicle} | ${tripType}*\n` +
              `👤 ${name} | ${phone}\n` +
              `🗓️ ${date} ${time}\n` +
              `💰 *${fareVal}*\n\n` +
              `Pickup: ${pickupVal}\n` +
              `Drop: ${dropVal}\n` +
              `Route: ${routeLink}`;

  // Double-encode the FULL message to preserve %0A / %0A%0A and special chars
  const encodedMsg = encodeURIComponent(msg);

  window.open(`https://wa.me/919651191446?text=${encodedMsg}`, "_blank");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
