<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookGadi - Best SUV & Sedan Taxi Fare Calculator | Outstation & Local</title>
<meta name="description" content="BookGadi offers the most accurate taxi fare calculator for SUV and Sedan. Get instant quotes for outstation one-way, round trips, and local 8hr/80km packages. Book via WhatsApp!">
<meta name="keywords" content="BookGadi, Taxi Fare Calculator, Online Taxi Booking, SUV Taxi, Sedan Taxi, Outstation Cabs, Local Taxi Package">
<meta name="author" content="BookGadi">
<link rel="canonical" href="https://www.bookgadi.com">

<meta property="og:title" content="BookGadi - Smart Taxi Fare Calculator">
<meta property="og:description" content="Calculate your taxi fare instantly. Best rates for SUV and Sedan. One-way and Round trip available.">
<meta property="og:url" content="https://www.bookgadi.com">
<meta property="og:type" content="website">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TaxiService",
  "name": "BookGadi",
  "description": "Premium SUV and Sedan taxi services for local and outstation trips.",
  "url": "https://www.bookgadi.com",
  "provider": {
    "@type": "LocalBusiness",
    "name": "BookGadi",
    "telephone": "+919651191446",
    "priceRange": "₹₹"
  },
  "areaServed": "India",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Taxi Services",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": { "@type": "Service", "name": "Outstation One Way" }
      },
      {
        "@type": "Offer",
        "itemOffered": { "@type": "Service", "name": "Local 8hr/80km Package" }
      }
    ]
  }
}
</script>
<style>
:root {
  --primary: #1a73e8;
  --success: #25D366;
  --dark: #202124;
}

*{box-sizing:border-box;margin:0;padding:0;font-family: 'Segoe UI', sans-serif;}

body {
  background-color: #f3f4f7;
  background-image: radial-gradient(#d1d5db 1px, transparent 1px);
  background-size: 20px 20px; /* Chote dots wala background */
  min-height: 100vh;
  display: flex;
  flex-direction: column; /* Added for SEO text flow */
  align-items: center;
  justify-content: center;
  padding: 5px;
}

.card{
  width: 100%;
  max-width: 450px;
  background: #fff;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

#map{height:320px; width:100%; background:#e5e3df;}

.content{padding: 20px;}

.input-box {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  border-radius: 12px;
  border: 1.5px solid #eee;
  margin-bottom: 10px;
  outline: none;
  transition: 0.3s;
}

.input-box:focus { border-color: var(--primary); }

.btn-loc {
  background: #f1f3f4;
  color: var(--primary);
  border: none;
  padding: 8px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  margin-bottom: 15px;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid #eee;
  margin-bottom: 15px;
}

.trip-type {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  display: none; /* Only shows for outstation */
}

.trip-type label {
  flex: 1;
  padding: 10px;
  background: #f8f9fa;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.trip-type input { display: none; }
.trip-type label:has(input:checked) { background: var(--primary); color: #fff; }

.main-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.btn-calc { background: var(--dark); color: #fff; }
.btn-wa { background: var(--success); color: #fff; margin-top: 10px; display: none; }

#result { margin-top: 15px; }
.fare-card {
  padding: 15px;
  background: #f0f7ff;
  border-radius: 12px;
  border-left: 5px solid var(--primary);
}

#userForm { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }

/* SEO Friendly Hidden Heading */
.seo-h1 { position: absolute; left: -9999px; }
</style>
</head>

<body>

<h1 class="seo-h1">BookGadi Taxi Fare Calculator - Reliable SUV & Sedan Services</h1>

<div class="card">
  <div id="map"></div>

  <div class="content">
    <input id="pickup" class="input-box" placeholder="Kahan se? (Pickup Location)">
    <button class="btn-loc" id="locBtn" onclick="useMyLocation()">📍 Current Location Use Karein</button>
    
    <input id="drop" class="input-box" placeholder="Kahan tak? (Drop Location)">

    <select id="vehicle">
      <option value="12">🚙 SUV (₹12/km)</option>
      <option value="10">🚕 Sedan (₹10/km)</option>
    </select>

    <div id="tripOptions" class="row trip-type">
      <label><input type="radio" name="trip" id="oneway" checked onchange="calculateFare()"> One Way</label>
      <label><input type="radio" name="trip" id="roundtrip" onchange="calculateFare()"> Round Trip</label>
    </div>

    <button class="main-btn btn-calc" onclick="calculateFare()">Kiraaya Dekhein</button>

    <div id="result"></div>

    <button id="waBtn" class="main-btn btn-wa" onclick="openBooking()">💬 WhatsApp Par Book Karein</button>

    <div id="userForm">
      <input id="custName" class="input-box" placeholder="Aapka Naam">
      <input id="custPhone" class="input-box" type="tel" placeholder="Mobile Number">
      <button class="main-btn btn-wa" style="display:block" onclick="sendWhatsApp()">Confirm & Send</button>
    </div>
  </div>
</div>

<script>
let map, geocoder, pickupAC, dropAC, pickupPlace, dropPlace, directionsRenderer, directionsService;
let lastKm = 0;

function initMap(){
  geocoder = new google.maps.Geocoder();
  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    polylineOptions: { strokeColor: "#1a73e8", strokeWeight: 5 }
  });

  map = new google.maps.Map(document.getElementById("map"),{
    center:{lat:26.8467, lng:80.9462}, zoom:12, disableDefaultUI: true
  });
  directionsRenderer.setMap(map);

  pickupAC = new google.maps.places.Autocomplete(document.getElementById("pickup"),{componentRestrictions:{country:"in"}});
  dropAC   = new google.maps.places.Autocomplete(document.getElementById("drop"),{componentRestrictions:{country:"in"}});

  pickupAC.addListener("place_changed",()=> { pickupPlace = pickupAC.getPlace(); });
  dropAC.addListener("place_changed",()=> { dropPlace = dropAC.getPlace(); });
}

function useMyLocation(){
  const btn = document.getElementById("locBtn");
  btn.innerText = "⌛ Location dhoondh rahe hain...";

  navigator.geolocation.getCurrentPosition((pos) => {
    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    geocoder.geocode({ location: latlng }, (results, status) => {
      if (status === "OK" && results[0]) {
        document.getElementById("pickup").value = results[0].formatted_address;
        pickupPlace = results[0];
        map.setCenter(latlng);
        map.setZoom(15);
        btn.innerText = "✅ Location Mil Gayi";
      }
    });
  }, () => { 
    alert("Location access allow karein"); 
    btn.innerText = "📍 Phir se koshish karein";
  }, { enableHighAccuracy: true });
}

function calculateFare(){
  if(!pickupPlace || !dropPlace) { alert("Dono location select karein"); return; }

  directionsService.route({
    origin: pickupPlace.formatted_address || pickupPlace.geometry.location,
    destination: dropPlace.formatted_address || dropPlace.geometry.location,
    travelMode: 'DRIVING'
  }, (res, status) => {
    if (status === 'OK') {
      directionsRenderer.setDirections(res);
      lastKm = res.routes[0].legs[0].distance.value / 1000;
      updateUI();
    }
  });
}

function updateUI(){
  const rate = Number(document.getElementById("vehicle").value);
  const isRound = document.getElementById("roundtrip").checked;
  const isLocal = lastKm < 25; 

  document.getElementById("tripOptions").style.display = isLocal ? "none" : "flex";
  
  let fare = isRound ? Math.round(lastKm * rate * 2 + 300) : Math.round(150 + lastKm * rate);
  if(isLocal) fare = 1800;

  document.getElementById("result").innerHTML = `
    <div class="fare-card">
      <b>Duri:</b> ${lastKm.toFixed(1)} km<br>
      <b>Kiraaya:</b> <span style="font-size:22px; color:var(--primary)">₹${fare}</span>
      ${isLocal ? '<br><small>(Local 8Hr/80Km Pack)</small>' : ''}
    </div>`;
  document.getElementById("waBtn").style.display = "block";
}

function openBooking(){ document.getElementById("userForm").style.display = "block"; }

function sendWhatsApp(){
  const name = document.getElementById("custName").value;
  const phone = document.getElementById("custPhone").value;
  if(!name || !phone) { alert("Detail bharein"); return; }
  
  const fareVal = document.querySelector(".fare-card span").innerText;
  const msg = `*BookGadi Booking Request*%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*From:* ${document.getElementById("pickup").value}%0A*To:* ${document.getElementById("drop").value}%0A*Distance:* ${lastKm.toFixed(1)}km%0A*Total Fare:* ${fareVal}`;
  window.open(`https://wa.me/919651191446?text=${msg}`, "_blank");
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8fFUPeGfUy8Wwh-mQ_d3fbGZzKBy7VwM&libraries=places&callback=initMap" async defer></script>

</body>
</html>
