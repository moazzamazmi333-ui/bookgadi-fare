<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>BookGadi AI - Senior Manager Edition</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; height: 600px; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        #chatDisplay { flex: 1; padding: 15px; overflow-y: auto; background: #ffffff; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #1a73e8; color: white; align-self: flex-end; border-radius: 12px 12px 0 12px; }
        .ai { background: #f1f0f0; color: #333; align-self: flex-start; border-radius: 12px 12px 12px 0; }
        .input-area { border-top: 1px solid #ddd; padding: 15px; display: flex; gap: 10px; background: #fff; }
        input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">🚖 BookGadi AI (Smart Memory)</div>
    <div id="chatDisplay">
        <div class="msg ai">Namaste! Main BookGadi AI hoon. Main taxi booking mein aapki kaise madad kar sakta hoon?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Kahan jana hai?..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Bhejein</button>
    </div>
</div>

<script>
    // SECURITY: API Key split for safety
    const p1 = "AIzaSyA2bnLTcDGaOO";
    const p2 = "pxyD4_2_3HAn9JEU3eAgI";
    const API_KEY = p1 + p2;

    // HISTORY: Purani baatein yaad rakhne ke liye
    let chatHistory = [];

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const display = document.getElementById("chatDisplay");
        const text = input.value.trim();
        if (!text) return;

        // User ka message dikhayein
        display.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = "";
        display.scrollTop = display.scrollHeight;

        // Loading indicator
        const loadingId = "load-" + Date.now();
        display.innerHTML += `<div class="msg ai" id="${loadingId}">...</div>`;

        // MASTER INSTRUCTIONS: AI ko Manager banane ke liye
        const systemRule = `
STRICT RULES FOR BOOKGADI AI:
1. Aap sirf ek Taxi Manager ho. Emojis aur faltu bhashan BAND karo.
2. Jawab sirf 2 line mein hona chahiye. No 'Are Wah', No 'Nawabo ka shehar'.
3. Sirf kaam ki baat: "Lucknow ke liye Sedan ₹10/km aur SUV ₹12/km hai. 9651191446 par call karein."
4. Agar user destination bataye, toh turant Rate batao aur Call karne ko bolo.
5. Books ya Library bus train ki baat mat karna, hum sirf Taxi GAADI book karte hain.`;
        // History mein user ka naya sawal add karein
        chatHistory.push({ role: "user", parts: [{ text: text }] });

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: chatHistory, // Poori purani baat bhej rahe hain
                    systemInstruction: { parts: [{ text: systemRule }] } // Rules alag se
                })
            });

            const data = await response.json();
            const aiDiv = document.getElementById(loadingId);

            if (data.candidates && data.candidates[0].content) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                aiDiv.innerText = aiResponse;
                
                // History mein AI ka jawab add karein
                chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
            } else {
                aiDiv.innerText = "Maaf kijiye, abhi system busy hai. 9651191446 par call karein.";
            }
        } catch (e) {
            document.getElementById(loadingId).innerText = "Network Error! Connection check karein.";
        }
        display.scrollTop = display.scrollHeight;
    }
</script>

</body>
</html>
